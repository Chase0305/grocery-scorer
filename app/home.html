<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The data fetches already pass {cache:'no-store'}, but the DOCUMENT itself
     was still served from cache, so a rescored catalog looked unchanged because
     the page was running the OLD build of this file. Cost real debugging time. -->
<meta http-equiv="Cache-Control" content="no-store">
<title>GroceryScorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F5A43">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GroceryScorer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF9F0; --card: #FFFFFF; --line: #F0E4D0; --ink: #2B2118; --ink-soft: #6B5E4E; --ink-faint: #A69880;
    --coral: #FF6B4A; --green: #3FA55A; --amber: #FFB648; --display: 'Nunito', sans-serif; --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); padding-bottom: 90px; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 20px 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .logo { font-family: var(--display); font-weight: 900; font-size: 22px; }
  .logo span { color: var(--coral); }
  .count-pill { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }

  .hero-search { text-align: center; margin: 30px 0 28px; }
  .hero-search h1 { font-family: var(--display); font-weight: 900; font-size: 32px; margin: 0 0 18px; }
  .search-pill {
    max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 15px 22px;
    box-shadow: 0 8px 24px rgba(43,33,24,.06);
  }
  .search-pill input { flex: 1; border: none; outline: none; font-size: 16px; font-family: var(--sans); background: none; color: var(--ink); }
  .search-pill svg { color: var(--ink-faint); flex: 0 0 auto; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 24px; }
  .show-more {
    grid-column: 1/-1; padding: 13px; border: 2px dashed var(--line); border-radius: 16px;
    background: none; color: var(--ink-soft); font-family: var(--sans); font-size: .85rem; font-weight: 700;
    cursor: pointer; margin-top: 4px;
  }
  .show-more:hover { border-color: var(--coral); color: var(--coral); }
  .results-end { grid-column: 1/-1; text-align: center; font-size: .8rem; color: var(--ink-faint); padding: 10px 0; }
  .card {
    background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 14px;
    display: flex; flex-direction: column; position: relative; transition: transform .12s, box-shadow .12s;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(43,33,24,.10); }
  .list-thumb-wrap { cursor: pointer; }
  .card-img { width: 100%; height: 110px; border-radius: 14px; background: #FBF5E8; display: grid; place-items: center; margin-bottom: 10px; overflow: hidden; }
  .card-img img { max-width: 88%; max-height: 88%; object-fit: contain; }
  .card-brand { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); }
  .card-name { font-size: 13px; font-weight: 600; line-height: 1.3; margin: 3px 0 8px; min-height: 34px; }
  /* Score, price and any banner chips share this row, so it has to wrap -
     adding the price pushed the chip outside the card otherwise. The add
     button stays pinned right on the first line. */
  .card-foot { display: flex; align-items: center; justify-content: space-between;
    margin-top: auto; gap: 8px; }
  .card-foot-left { flex: 1 1 auto; min-width: 0; display: flex; align-items: center;
    flex-wrap: wrap; gap: 5px 6px; }
  .card-foot .add-fab { flex: 0 0 auto; }
  .grade-chip {
    font-family: var(--display); font-weight: 800; font-size: 13px; color: #fff;
    padding: 5px 10px; border-radius: 999px;
  }
  .grade-chip.none { background: #EDE2CC; color: var(--ink-faint); }
  /* Carcinogen warning. Three distinct colours because IARC Group 1 ("known")
     and Group 2B ("possible") are genuinely different claims - one badge for
     both would tell the shopper less than nothing. */
  .warn-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px 3px 6px;
    border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .01em;
    cursor: help; white-space: nowrap; }
  .warn-chip svg { flex: none; }
  .warn-known    { background: #FBE3E1; color: #A32218; }
  .warn-probable { background: #FCEBDC; color: #A85A15; }
  .warn-possible { background: #FBF3D6; color: #8A6A12; }
  .card-price { font-size: 13px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .card-unit { font-size: 11px; font-weight: 600; color: var(--ink-faint); white-space: nowrap; }
  .detail-price { font-size: 13px; color: var(--ink-faint); margin-top: 3px; }
  .detail-price b { color: var(--ink); font-size: 14px; }
  .detail-warnings { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 16px; }
  .detail-warn { border-radius: 12px; padding: 11px 13px; border: 1px solid transparent; }
  .detail-warn.warn-known    { border-color: #F0C4BF; }
  .detail-warn.warn-probable { border-color: #F2D2B2; }
  .detail-warn.warn-possible { border-color: #EEE0B0; }
  .detail-warn-top { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 13px; }
  .detail-warn-class { font-weight: 600; font-size: 12px; opacity: .85; margin-left: auto; }
  .detail-warn-note { font-size: 12.5px; line-height: 1.45; margin-top: 5px; color: var(--ink); }
  .detail-warn-src { font-size: 11.5px; margin-top: 4px; opacity: .75; }
  /* Nutrition banners are INFORMATION, not a health-agency warning - styled
     calmer than the carcinogen chips on purpose so the two don't compete. */
  .ing-chip { background: #FCE9DC; color: #8A4B18; }
  .price-chip { background: #E3EEF7; color: #2F5876; }
  .detail-priceflag { background: #E3EEF7; color: #2F5876; }
  .detail-ingflag { background: #FCE9DC; color: #8A4B18; }
  .nut-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px;
    border-radius: 999px; font-size: 11px; font-weight: 700;
    background: #EDE7F6; color: #59468C; cursor: help; white-space: nowrap; }
  .detail-nutflags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .detail-nutflag { background: #EDE7F6; color: #59468C; border-radius: 12px;
    padding: 9px 12px; font-size: 12.5px; flex: 1 1 210px; }
  .detail-nutflag b { display: block; font-size: 13px; margin-bottom: 2px; }
  .detail-nutflag span { opacity: .8; }
  /* ---- filter panel ---- */
  .filter-bar { max-width: 1000px; margin: 14px auto 0; padding: 0 20px; display: flex;
    align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-toggle { border: 1px solid #E2D6BC; background: #fff; border-radius: 999px;
    padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink); }
  .filter-toggle:hover { border-color: #C9B894; }
  .filter-toggle.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .filter-clear { background: none; border: none; color: var(--ink-faint); font-size: 12.5px;
    cursor: pointer; text-decoration: underline; }
  .filter-panel { max-width: 1000px; margin: 10px auto 0; padding: 16px 20px; background: #fff;
    border: 1px solid #EFE4CE; border-radius: 16px; }
  .filter-panel[hidden] { display: none; }
  .filter-group { margin-bottom: 14px; }
  .filter-group:last-child { margin-bottom: 0; }
  .filter-group h4 { margin: 0 0 3px; font-size: 13px; }
  .filter-group p { margin: 0 0 9px; font-size: 12px; color: var(--ink-faint); line-height: 1.45; }
  .filter-opts { display: flex; flex-wrap: wrap; gap: 7px; }
  .filter-opt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #E2D6BC;
    background: #FDFBF6; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  .filter-opt input { margin: 0; cursor: pointer; }
  .filter-opt.on { background: #E8F2E2; border-color: #9CC48A; font-weight: 700; }
  .filter-opt.on.avoid { background: #FBEAE6; border-color: #E0A99B; }
  .filter-note { margin-top: 12px; font-size: 12px; background: #FBF3D6; color: #7A5E10;
    border-radius: 10px; padding: 9px 12px; line-height: 1.5; }
  .filter-summary { font-size: 12.5px; color: var(--ink-faint); }
  .profile-pick { border: 1px solid #E2D6BC; background: #fff; border-radius: 999px; padding: 7px 13px;
    font-size: 13px; font-weight: 700; color: var(--ink); font-family: var(--sans); cursor: pointer; }
  .profile-pick.on { background: #EDE7F6; border-color: #C3B3E0; color: #46356F; }
  .profile-panel { max-width: 1000px; margin: 10px auto 0; padding: 14px 20px; background: var(--card);
    border: 1px solid #EFE4CE; border-radius: 16px; }
  .profile-panel[hidden] { display: none; }
  .profile-opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #FDFBF6;
    border-radius: 12px; padding: 10px 13px; margin-bottom: 7px; cursor: pointer; font-family: var(--sans); }
  .price-row { display: flex; gap: 6px; margin: 0 0 12px; }
  .price-opt { flex: 1; min-height: 40px; border: 1px solid var(--line); background: #FDFBF6; border-radius: 10px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); padding: 4px 6px; }
  .price-opt.on { background: #E3F1E6; border-color: #9CCBA6; }
  .price-head { font-size: 12px; color: var(--ink-soft); margin: 0 0 6px; line-height: 1.4; }
  .profile-opt.on { background: #EDE7F6; border-color: #C3B3E0; }
  .profile-opt b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .profile-opt span { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
  .profile-opt em { display: block; font-size: 11px; color: var(--ink-faint); font-style: normal; margin-top: 3px; }
  .profile-note { font-size: 11.5px; color: var(--ink-faint); margin-top: 10px; line-height: 1.5; }
  .sev-row { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid #F6EEE0; }
  .sev-row:last-child { border-bottom: none; }
  .sev-name { flex: 1; min-width: 0; font-size: 13px; }
  .sev-name small { display: block; font-size: 11px; color: var(--ink-faint); }
  .sev-btns { flex: 0 0 auto; display: flex; gap: 4px; }
  .sev-btn { border: 1px solid var(--line); background: #FDFBF6; border-radius: 7px; padding: 4px 9px;
    font-size: 11px; font-weight: 700; cursor: pointer; color: var(--ink-soft); font-family: var(--sans); }
  .sev-btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .sev-btn.on.off { background: #E8E0D2; color: var(--ink-faint); border-color: #DCD1BD; }
  .add-fab {
    width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--ink); color: #fff;
    cursor: pointer; display: grid; place-items: center; transition: .12s;
  }
  .add-fab:hover { background: var(--coral); transform: scale(1.08); }
  .add-fab.added { background: var(--green); }
  .empty-state { text-align: center; color: var(--ink-faint); padding: 50px 20px; font-size: 14px; grid-column: 1/-1; }

  .list-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 3px solid var(--ink);
    padding: 14px 20px; display: flex; align-items: center; gap: 16px; transform: translateY(100%); transition: transform .22s;
  }
  .list-bar.open { transform: translateY(0); }
  .list-bar-inner { max-width: 1000px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 18px; }
  .list-open-btn { flex: 0 0 auto; background: var(--ink); color: #fff; border: none; border-radius: 999px;
    padding: 10px 18px; font-size: 13.5px; font-weight: 800; cursor: pointer; font-family: var(--sans); }
  /* ---- full shopping list ---- */
  .sheet { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; }
  .sheet[hidden] { display: none; }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(43,33,24,.45); }
  .sheet-panel { position: relative; background: var(--bg); border-radius: 20px; width: 100%;
    max-width: 620px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
  .sheet-head { padding: 18px 64px 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  .sheet-head h2 { margin: 0 0 3px; font-family: var(--display); font-size: 20px; font-weight: 900; }
  .sheet-head p { margin: 0; font-size: 12.5px; color: var(--ink-faint); }
  .sheet-close { position: absolute; top: 14px; right: 14px; border: none; background: #F3E9D8;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px; line-height: 1; }
  .sheet-body { overflow-y: auto; padding: 14px 20px 20px; }
  .add-item { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-item input { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 999px;
    padding: 11px 16px; font-size: 15px; font-family: var(--sans); background: var(--card); color: var(--ink); }
  .add-item input:focus { outline: none; border-color: #C9B894; }
  .add-item button { flex: 0 0 auto; background: var(--coral); color: #fff; border: none;
    border-radius: 999px; padding: 0 18px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: var(--sans); }
  .aisle-group { margin-bottom: 18px; }
  .aisle-head { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 7px 2px; }
  .li { display: flex; align-items: center; gap: 11px; background: var(--card); border: 1px solid var(--line);
    border-radius: 13px; padding: 10px 12px; margin-bottom: 7px; }
  .li.done { opacity: .5; }
  .li.done .li-name { text-decoration: line-through; }
  .li-check { flex: 0 0 auto; width: 23px; height: 23px; border-radius: 6px; border: 2px solid #D8C9AC;
    background: var(--card); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .li.done .li-check { background: var(--green); border-color: var(--green); color: #fff; }
  .li-img { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 8px; background: #FBF5EA;
    display: grid; place-items: center; overflow: hidden; }
  .li-img img { max-width: 92%; max-height: 92%; object-fit: contain; }
  .li-main { flex: 1; min-width: 0; }
  .li-want { font-size: 11px; font-weight: 800; color: var(--coral); text-transform: uppercase; letter-spacing: .04em; }
  .li-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .li-meta { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
  .li-right { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
  .li-score { width: 34px; height: 25px; border-radius: 999px; color: #fff; font-size: 12px;
    font-weight: 800; display: grid; place-items: center; }
  .li-score.none { background: #EDE2CC; color: var(--ink-faint); }
  .li-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 4px 8px;
    font-size: 11px; font-weight: 700; cursor: pointer; color: var(--ink-soft); font-family: var(--sans); }
  .li-btn:hover { border-color: #C9B894; }
  .swap-row { padding: 2px 0 10px 46px; }
  .swap-opt { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 9px; cursor: pointer; }
  .swap-opt:hover { background: #F7EFE1; }
  .swap-opt.current { background: #EDF5E9; }
  .list-total { background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .list-total b { font-family: var(--display); font-size: 19px; }
  .list-empty { text-align: center; color: var(--ink-faint); font-size: 13.5px; padding: 26px 10px; line-height: 1.5; }
  /* ---- meal cards ---- */
  /* #results is itself a grid, so the meal shelf has to span every column -
     without this the cards stack into one narrow strip. */
  .meals { margin-top: 26px; grid-column: 1 / -1; }
  .meals-head { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 3px 2px; }
  .meals-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 14px 2px; }
  .back-btn { min-height: 40px; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    font: inherit; font-size: 13.5px; font-weight: 700; padding: 0 14px; cursor: pointer; color: var(--ink); flex: 0 0 auto; }
  .back-btn[hidden] { display: none; }
  .mp-amt { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); background: #F1ECDF; border-radius: 6px; padding: 1px 6px; margin-left: 4px; white-space: nowrap; }
  .relaxed a { display: inline-block; padding: 8px 0; color: inherit; font-weight: 600; }
  .relaxed { grid-column: 1 / -1; font-size: 12.5px; color: #7A5E10; background: #FBF3D6;
    border-radius: 10px; padding: 9px 12px; margin-bottom: 4px; }
  .meal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
  /* A photo with the words layered over it, the shape a supermarket
     homepage uses. The scrim is a two-stop gradient rather than a flat tint:
     dark enough on the left for white type to stay legible on a bright
     photo, clear on the right so the food is still the picture. */
  .meal { position: relative; border-radius: 18px; overflow: hidden; border: none;
    background: #2B2118; cursor: pointer; text-align: left; padding: 0; font-family: var(--sans);
    display: block; aspect-ratio: 3 / 2; min-height: 200px; }
  .meal-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .meal-scrim { position: absolute; inset: 0;
    background: linear-gradient(100deg, rgba(20,14,9,.88) 0%, rgba(20,14,9,.72) 38%, rgba(20,14,9,.18) 72%, rgba(20,14,9,.05) 100%); }
  .meal-body { position: absolute; inset: 0; padding: 18px 18px 16px; display: flex;
    flex-direction: column; justify-content: flex-end; }
  .meal-title { font-family: var(--display); font-weight: 900; font-size: 25px; line-height: 1.08;
    color: #fff; max-width: 78%; text-shadow: 0 1px 14px rgba(0,0,0,.45); }
  .meal-sub { font-size: 12.5px; color: rgba(255,255,255,.88); margin-top: 5px; line-height: 1.35;
    max-width: 74%; text-shadow: 0 1px 10px rgba(0,0,0,.5); }
  .meal-foot { margin-top: 12px; display: flex; align-items: center; gap: 9px; }
  .meal-score { color: #fff; border-radius: 999px; font-size: 12.5px; font-weight: 800; padding: 4px 11px;
    box-shadow: 0 1px 10px rgba(0,0,0,.35); }
  .meal-n { font-size: 11.5px; color: rgba(255,255,255,.72); }
  .meal-add { margin-left: auto; background: #fff; color: var(--ink); border: none; border-radius: 999px;
    padding: 9px 16px; font-size: 12.5px; font-weight: 800; font-family: var(--sans); }
  .meal:hover .meal-add { background: var(--coral); color: #fff; }
  /* ---- buy or make ---- */
  .mk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .mk-card { border: 1px solid var(--line); background: var(--card); border-radius: 15px; padding: 13px;
    cursor: pointer; text-align: left; font-family: var(--sans); display: flex; flex-direction: column; gap: 8px; }
  .mk-card:hover { border-color: #C9B894; }
  .mk-title { font-family: var(--display); font-weight: 900; font-size: 16px; }
  .mk-vs { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .mk-pill { border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 800; color: #fff; }
  .mk-arrow { color: var(--ink-faint); font-weight: 700; }
  .mk-note { font-size: 11.5px; color: var(--ink-faint); line-height: 1.4; }
  .cmp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cmp-col { border: 1px solid var(--line); border-radius: 14px; padding: 13px; background: var(--card); }
  .cmp-col.win { border-color: #9CC48A; background: #F6FBF4; }
  .cmp-h { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 7px; }
  .cmp-score { display: inline-block; border-radius: 999px; color: #fff; font-weight: 800; font-size: 15px;
    padding: 4px 12px; margin-bottom: 7px; }
  .cmp-name { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .cmp-meta { font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; }
  .cmp-ings { font-size: 11.5px; color: var(--ink-soft); margin-top: 9px; line-height: 1.5;
    max-height: 132px; overflow-y: auto; }
  .cmp-li { display: flex; gap: 7px; align-items: baseline; padding: 3px 0; }
  .cmp-li b { flex: 0 0 auto; font-size: 11px; border-radius: 999px; color: #fff; padding: 1px 6px; }

  .list-thumbs { display: flex; gap: -8px; flex: 1; overflow-x: auto; }
  .list-thumb-wrap { position: relative; flex: 0 0 auto; margin-right: 8px; }
  .list-thumb { width: 46px; height: 46px; border-radius: 12px; background: #FBF5E8; border: 2px solid var(--line); object-fit: contain; padding: 4px; }
  .list-thumb-x {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink);

  }

  /* --------------------------------------------------- score breakdown */
  .detail-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; }
  .detail-overlay[hidden] { display: none; }

    box-shadow: 0 24px 60px rgba(43,33,24,.28);
  }
  .detail-close {
    position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%;
    border: none; background: var(--bg); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center;
  }

  .detail-name { font-size: 14.5px; font-weight: 700; line-height: 1.3; margin: 2px 0 4px; }

  .detail-score {
    font-family: var(--display); font-weight: 900; font-size: 18px; color: #fff;

  }
  .detail-rows { display: flex; flex-direction: column; gap: 12px; }

  .detail-row-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); margin-bottom: 3px; }
  .detail-row-exp { font-size: 13.5px; color: var(--ink); line-height: 1.4; }
  .detail-empty { font-size: 13.5px; color: var(--ink-faint); font-style: italic; text-align: center; padding: 10px 0; }

  /* ---------------------------------------------------------------- mobile
     This app's real use is one-handed, in an aisle, on a phone - and until
     2026-09-18 the page had no media queries at all. At 375px the stats pill
     collided with the logo, the heading ate two lines of a small screen, the
     search placeholder was cut off mid-word and the card grid fell to a
     single column, so you saw one product per scroll.

     Everything below is layout only. No scores, data or behaviour change. */

  /* ---- meal panel -------------------------------------------------------
     Tapping a meal opens this, not the shopping list. It shows what the meal
     WOULD put on your list, then hands it over with one button. Nothing here
     is tickable on purpose: there is one list you shop from and this is not
     it. */
  .meal-hero { position: relative; border-radius: 14px; overflow: hidden; height: 148px; }
  .meal-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meal-hero-scrim { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(28,24,18,.85) 0%, rgba(28,24,18,.5) 55%, rgba(28,24,18,.12) 100%); }
  .meal-hero-txt { position: absolute; left: 16px; right: 16px; bottom: 12px; color: #fff; }
  .meal-hero-txt b { display: block; font-family: var(--display); font-size: 22px; font-weight: 900; line-height: 1.15; }
  .meal-hero-txt span { font-size: 12.5px; opacity: .85; }
  .mp-head { display: flex; justify-content: space-between; align-items: baseline;
    margin: 15px 2px 2px; font-size: 12.5px; color: var(--ink-faint); }
  .mp-row { display: flex; align-items: center; gap: 11px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .mp-row:last-of-type { border-bottom: none; }
  .mp-score { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px; color: #fff;
    display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 14px; }
  .mp-score.none { background: #CFC3AC; }
  .mp-main { flex: 1; min-width: 0; }
  .mp-want { font-size: 13.5px; font-weight: 700; }
  .mp-pick { font-size: 12px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-on { flex: 0 0 auto; font-size: 11.5px; font-weight: 700; color: var(--green); }
  .big-btn { width: 100%; background: var(--ink); color: #fff; border: none; border-radius: 999px;
    padding: 14px; font-size: 14.5px; font-weight: 800; font-family: var(--sans); cursor: pointer; margin-top: 15px; }
  .big-btn[disabled] { opacity: .4; cursor: default; }

  /* ---- taking the list out of this website ------------------------------
     The phone in the store is the point. Share hands the list to whatever
     list app they actually use; copy is the fallback everywhere else. */
  .list-export { display: flex; gap: 8px; margin-top: 12px; }
  .list-export button { flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 11px; font-size: 13px; font-weight: 700;
    font-family: var(--sans); color: var(--ink); cursor: pointer; }
  .list-export button:hover { background: #F7EFE1; }

  /* ---- tabs + dinner flowchart -------------------------------------------
     The flowchart is a few big buttons, not a form: each answer narrows the
     meals and every button says how many would be left, so pressing one is
     never a leap of faith. */
  .tabs { display: flex; gap: 6px; margin: 0 0 18px; background: var(--card); border: 2px solid var(--line);
    border-radius: 999px; padding: 4px; width: fit-content; }
  .tab { border: none; background: none; font-family: var(--sans); font-weight: 800; font-size: 13.5px;
    padding: 9px 18px; border-radius: 999px; color: var(--ink-soft); cursor: pointer; }
  .tab.active { background: var(--ink); color: #fff; }
  .dq { max-width: 640px; margin: 0 auto; }
  .dq-prog { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); }
  .dq h2 { font-family: var(--display); font-weight: 900; font-size: 30px; margin: 6px 0 16px; line-height: 1.15; }
  .dq-opts { display: grid; gap: 10px; }
  .dq-opt { display: flex; justify-content: space-between; align-items: center; text-align: left;
    background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 17px 18px;
    font-family: var(--sans); font-size: 16px; font-weight: 800; color: var(--ink); cursor: pointer; }
  .dq-opt:hover:not([disabled]) { border-color: var(--coral); }
  .dq-opt[disabled] { opacity: .38; cursor: default; }

  .dq.dq-ask { max-width: none; }

  .dq-bars { display: flex; gap: 5px; }
  .dq-bars i { width: 34px; height: 5px; border-radius: 3px; background: var(--line); }
  .dq-bars i.done { background: var(--brand); opacity: .45; }
  .dq-bars i.now { background: var(--brand); }
  .dq-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .dq-tile { position: relative; aspect-ratio: 4 / 3; border: none; border-radius: 18px; overflow: hidden; padding: 0;
    background: var(--brand); cursor: pointer; text-align: left; font-family: var(--sans); color: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); transition: transform .15s, box-shadow .15s; }
  .dq-tile:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15,90,67,.18); }
  .dq-tile:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .dq-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dq-tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.72)); }
  .dq-tile-txt { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 1; }
  .dq-tile-txt b { display: block; font-family: var(--display); font-size: 22px; font-weight: 650; line-height: 1.1; }
  .dq-tile-txt small { display: block; margin-top: 3px; font-size: 13px; font-weight: 600; opacity: .88; }
  .dq-tile[disabled] { cursor: default; filter: grayscale(1); opacity: .45; }
  .dq-collage { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .dq-collage img { position: static; }
  @media (max-width: 600px) {
    .dq-tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
    .dq-tile { border-radius: 14px; }
    .dq-tile-txt { left: 12px; right: 10px; bottom: 10px; }
    .dq-tile-txt b { font-size: 17px; }
    .dq-tile-txt small { font-size: 12px; }
  }
  .dq-foot { display: flex; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
  .dq-link { background: none; border: none; font-family: var(--sans); font-size: 13.5px; font-weight: 700;
    color: var(--ink-soft); text-decoration: underline; cursor: pointer; padding: 4px 0; }
  .dq-chips { display: flex; gap: 7px; flex-wrap: wrap; margin: 0 0 14px; }
  .dq-chip { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px;
    font-family: var(--sans); font-size: 12.5px; font-weight: 800; color: var(--ink); cursor: pointer; }
  .dq-chip:after { content: " \00d7"; color: var(--ink-faint); }
  .dq-results-head { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    flex-wrap: wrap; margin: 0 0 14px; }
  .dq-results-head h2 { margin: 0; font-size: 26px; }
  .dq-surprise { background: var(--coral); color: #fff; border: none; border-radius: 999px; padding: 11px 20px;
    font-family: var(--sans); font-size: 14px; font-weight: 800; cursor: pointer; }
  .meals-more { display: block; margin: 14px auto 0; background: var(--card); border: 2px solid var(--line);
    border-radius: 999px; padding: 10px 20px; font-family: var(--sans); font-size: 13.5px; font-weight: 800;
    color: var(--ink); cursor: pointer; }

  /* ---- weekly planner ---------------------------------------------------- */
  .pl { max-width: 720px; margin: 0 auto; }
  .pl-head h2 { font-family: var(--display); font-weight: 900; font-size: 30px; margin: 0 0 4px; line-height: 1.15; }
  .pl-head p { margin: 0 0 16px; color: var(--ink-soft); font-size: 14px; line-height: 1.5; }
  .pl-summary { position: sticky; top: 8px; z-index: 5; background: var(--card); border: 2px solid var(--line);
    border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 18px; box-shadow: 0 6px 18px rgba(43,33,24,.08); }
  .pl-stats { flex: 1 1 200px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.4; }
  .pl-stats b { color: var(--ink); font-family: var(--display); font-size: 17px; }
  .pl-add { background: var(--ink); color: #fff; border: none; border-radius: 999px; padding: 12px 20px;

  .pl-row, .pl-sug { display: flex; align-items: center; gap: 11px; background: var(--card);

    text-align: left; font-family: var(--sans); color: var(--ink); }
  .pl-sug { cursor: pointer; }
  .pl-sug:hover { border-color: var(--coral); }
  .pl-row img, .pl-sug img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; }
  .pl-t { flex: 1; min-width: 0; font-size: 14px; font-weight: 800; }
  .pl-t small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-sc { flex: 0 0 auto; min-width: 32px; height: 32px; border-radius: 9px; color: #fff; display: grid;
    place-items: center; font-family: var(--display); font-weight: 900; font-size: 13px; }
  .pl-x { flex: 0 0 auto; background: none; border: none; font-size: 18px; color: var(--ink-faint);

  .pl-x:hover { background: #F7EFE1; color: var(--ink); }
  .pl-row > .pl-row { min-width: 0; }   /* the tappable part of a planned meal: shrink, don't push the remove button off the card */
  .pl-plus { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-size: 18px; font-weight: 800; }
  .pl-input { width: 100%; border: 2px solid var(--line); border-radius: 999px; padding: 12px 16px; font-size: 15px;
    font-family: var(--sans); background: var(--card); color: var(--ink); margin: 2px 0 8px; outline: none; }
  .pl-input:focus { border-color: var(--coral); }
  .pl-msg { font-size: 12.5px; color: #B4432B; min-height: 0; margin: -2px 0 6px 6px; }
  .pl-sugg-h { font-size: 12px; color: var(--ink-faint); margin: 2px 0 6px 6px; }
  .pl-empty { font-size: 13px; color: var(--ink-faint); margin: 0 0 8px 6px; }
  .pl-foot { margin-top: 6px; }

  /* ---- recipe import ----------------------------------------------------- */
  .im { max-width: 720px; margin: 0 auto; }
  .im-head h2 { font-family: var(--display); font-weight: 900; font-size: 30px; margin: 0 0 4px; line-height: 1.15; }
  .im-head p { margin: 0 0 14px; color: var(--ink-soft); font-size: 14px; line-height: 1.5; }
  .im-box { width: 100%; min-height: 96px; border: 2px solid var(--line); border-radius: 16px; padding: 13px 15px;
    font-family: var(--sans); font-size: 15px; background: var(--card); color: var(--ink); resize: vertical; outline: none; }
  .im-box:focus { border-color: var(--coral); }
  .im-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 6px; }
  .im-btn { background: var(--ink); color: #fff; border: none; border-radius: 999px; padding: 12px 20px; min-height: 44px;
    font-family: var(--sans); font-size: 14px; font-weight: 800; cursor: pointer; }
  .im-btn.alt { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
  .im-btn[disabled] { opacity: .4; cursor: default; }
  .im-share { margin: 0 0 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 0 14px; }
  .im-share summary { cursor: pointer; font-weight: 700; font-size: 14px; padding: 12px 0; min-height: 40px; box-sizing: border-box; }
  .im-share p, .im-share li { font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }
  .im-share ol { padding-left: 20px; margin: 6px 0 10px; }
  .im-share h4 { margin: 14px 0 4px; font-size: 14px; }
  .im-share .im-btn { margin: 4px 0 8px; }
  .im-bookmarklet { display: inline-block; min-height: 40px; box-sizing: border-box; line-height: 24px; padding: 8px 12px; border-radius: 999px; background: #2B2118; color: #fff !important;
    text-decoration: none; font-weight: 700; font-size: 13px; margin: 4px 0; }
  .im-msg { font-size: 13.5px; color: var(--ink-soft); min-height: 20px; margin: 4px 2px 10px; line-height: 1.45; }
  .im-msg.err { color: #B4432B; }
  .im-ai { font-size: 12.5px; color: var(--ink-faint); margin: 0 2px 14px; }
  .im-title { font-family: var(--display); font-weight: 900; font-size: 20px; margin: 4px 2px 2px; }
  .im-sub { font-size: 12.5px; color: var(--ink-faint); margin: 0 2px 12px; }
  .im-row { display: flex; gap: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 14px;
    padding: 8px 10px 10px 4px; margin: 0 0 8px; }
  .im-row.off { opacity: .5; }
  .im-inc { flex: 0 0 auto; width: 40px; min-height: 40px; display: grid; place-items: center; cursor: pointer; }
  .im-inc input { width: 20px; height: 20px; accent-color: var(--ink); }
  .im-body { flex: 1; min-width: 0; }
  .im-term { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 40px; font-size: 15px;
    font-weight: 700; font-family: var(--sans); color: var(--ink); background: #FDFBF6; }
  .im-raw { font-size: 12px; color: var(--ink-faint); margin: 4px 2px 0; line-height: 1.35; }
  .im-amt { display: inline-block; background: #F3E9D8; border-radius: 999px; padding: 1px 8px; font-size: 11.5px;
    font-weight: 800; color: var(--ink-soft); margin-right: 6px; }
  .im-match { display: flex; align-items: center; gap: 9px; margin-top: 8px; }
  .im-match img, .im-match .im-noimg { width: 40px; height: 40px; border-radius: 8px; object-fit: contain; background: #FBF5EA; flex: 0 0 auto; }
  .im-mname { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.3; }

  .im-tag { display: inline-block; margin-top: 6px; font-size: 11.5px; font-weight: 800; border-radius: 8px; padding: 3px 8px; }
  .im-tag.warn { background: #FFF1D6; color: #8A5A00; }
  .im-tag.none { background: #FBE3DC; color: #9C3A22; }
  .im-swap { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 0 11px;
    min-height: 40px; font-family: var(--sans); font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .im-alts { margin: 8px 0 0 0; }
  .im-alt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: #FDFBF6; border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 8px; margin: 0 0 5px; font-family: var(--sans); font-size: 12.5px; color: var(--ink); cursor: pointer; min-height: 40px; }
  .im-alt.cur { background: #EDF5E9; }
  .im-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); min-height: 40px; cursor: pointer; }
  .im-toggle input { width: 18px; height: 18px; accent-color: var(--ink); }
  .list-export .clear-btn { color: #B4432B; border-color: #F0D5CC; }
  .list-export .clear-btn.armed { background: #B4432B; color: #fff; border-color: #B4432B; }
  .toast { position: fixed; left: 50%; bottom: 96px; z-index: 90; background: var(--ink); color: #fff;
    padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 700; font-family: var(--sans);
    opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(10px);
    transition: opacity .18s ease, transform .18s ease; max-width: 88vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .wrap { padding: 14px 12px 32px; }

    /* The pill wrapped and shoved itself into the logo. Let both shrink, and
       drop the pill's border weight so it reads as a caption, not a button. */
    .top { margin-bottom: 14px; gap: 10px; }
    .logo { font-size: 19px; flex: 0 0 auto; }
    .count-pill { font-size: 11px; padding: 5px 10px; border-width: 1px;
      text-align: right; line-height: 1.3; }

    .hero-search { margin: 16px 0 16px; }
    .hero-search h1 { font-size: 21px; margin: 0 0 12px; line-height: 1.25; }
    .search-pill { max-width: none; padding: 11px 14px; }
    /* Keep the input at 16px: anything smaller makes iOS Safari zoom the
       whole page in on focus, which is worse than a cramped placeholder. */
    .search-pill input { font-size: 16px; min-width: 0; }

    /* Two columns, not one. One product per scroll is useless for comparing,
       which is the entire point of the page. */
    /* minmax(0, 1fr), not 1fr: a bare 1fr cannot shrink below its content, so a card
       whose price row did not fit grew past its half of the screen and made the
       whole page scroll sideways at 360 px (found by the exact-width audit). */
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
    .card { padding: 10px; }
    .card-img { height: 96px; }
    .card-name { font-size: 12.5px; line-height: 1.3; }
    .card-brand { font-size: 9.5px; }
    .card-price { font-size: 12px; }
    .card-unit { font-size: 10px; }
    .warn-chip, .nut-chip { font-size: 9.5px; padding: 2px 6px; }
    /* 36px is the smallest comfortable thumb target; the desktop size is
       smaller than that. */
    .add-fab { width: 36px; height: 36px; }

    .filter-bar { padding: 0 12px; gap: 8px; }
    .filter-panel { padding: 13px 12px; border-radius: 13px; }
    .filter-opt { font-size: 12px; padding: 7px 11px; }
    .filter-summary { font-size: 11.5px; }

    /* Full-bleed sheet rather than a floating card - a centred panel with
       margins wastes a third of a phone screen. */
    .detail-overlay { padding: 0; align-items: end; }
    .detail-panel { max-width: none; width: 100%; max-height: 92vh;
      border-radius: 18px 18px 0 0; padding-bottom: 28px; }
    .detail-nutflag { flex: 1 1 100%; }

    .list-bar-inner { gap: 10px; }
    .sheet { padding: 0; align-items: end; }
    .sheet-panel { max-width: none; max-height: 92vh; border-radius: 18px 18px 0 0; }
    .sheet-body { padding: 12px 14px 20px; }
    .swap-row { padding-left: 14px; }
    .meal-grid { grid-template-columns: 1fr; gap: 11px; }
    .meal { min-height: 168px; aspect-ratio: 16 / 9; }
    .meal-title { font-size: 21px; max-width: 86%; }
    .meal-sub { max-width: 84%; }
    .mk-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cmp-cols { grid-template-columns: 1fr; }
    .list-open-btn { padding: 9px 14px; font-size: 12.5px; }
    /* ---- tap targets (phone pass, 2026-09-30) -------------------------------
       An audit at 360/375/414 px found 40+ controls under 40 px. The ones that
       matter most are in the in-store flow: the tick-off boxes on the shopping
       list were 23 px, the Swap/remove buttons 23 px, the close button on every
       sheet 30 px. Small round controls keep their look and get an invisible
       hit area instead; text buttons just get taller. */
    .tab, .filter-toggle, .profile-pick, .list-open-btn, .filter-opt { min-height: 40px; }
    .dq-link, .filter-clear { padding-top: 13px; padding-bottom: 13px; }
    .dq-surprise { min-height: 44px; }
    .add-fab { width: 40px; height: 40px; }
    .pl-x { width: 40px; height: 40px; }
    .sheet-close, .detail-close { width: 40px; height: 40px; }
    .sev-btn { min-height: 40px; min-width: 40px; padding-left: 11px; padding-right: 11px; }
    .li-btn { min-height: 40px; min-width: 40px; padding-left: 11px; padding-right: 11px; }
    /* List rows: checkbox + photo + name + score + two buttons do not fit on one line
       at phone width - the name was squeezed to a sliver and wrapped onto six lines.
       The score and buttons drop to their own line under the name. */
    .li { flex-wrap: wrap; row-gap: 6px; }
    .li-right { flex: 1 1 100%; justify-content: flex-end; }
    .li-check, .list-thumb-x { position: relative; }
    .li-check::after, .list-thumb-x::after { content: ""; position: absolute; inset: -11px; }
    .im-head h2 { font-size: 23px; }
    .pl-head h2 { font-size: 23px; }
    .pl-summary { top: 4px; }
    .dq h2 { font-size: 23px; }
    .dq-results-head h2 { font-size: 21px; }
    .tab { padding: 8px 14px; font-size: 13px; }
    .meal-hero { height: 120px; }
    .meal-hero-txt b { font-size: 19px; }
    .toast { bottom: 88px; }
  }

  /* Very narrow phones (iPhone SE and similar). */
  @media (max-width: 400px) {
    /* the score pill, price and per-ounce price do not fit on one line in a half-width card */
    .card-foot-left { flex-wrap: wrap; row-gap: 1px; }
  }
  @media (max-width: 360px) {
    .hero-search h1 { font-size: 19px; }
    .card-img { height: 84px; }
    .count-pill { font-size: 10px; }
  }

  /* ================================================================ theme v2
     Design pass 2026-10-02, from the three sites the user likes:
       Whole Foods - deep green + cream, big food photography, pill search, soft 8-12 px corners
       Trader Joe's - serif headlines, generous white space, one confident accent
       EWG         - a dark photo hero behind the search; scores on a best-to-worst scale
     Kept as ONE override layer at the end of the stylesheet, so the old look is a delete away. */
  :root {
    --bg: #FAF6EE; --card: #FFFFFF; --line: #E7DFCF; --ink: #22302A; --ink-soft: #56625C; --ink-faint: #8A938D;
    --brand: #0F5A43; --brand-dark: #0A4433; --brand-soft: #E4EFE8; --accent: #B8352B;
    --coral: #0F5A43; --green: #2E8B57;
    --display: 'Fraunces', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif;
  }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .logo, .hero-search h1, .im-head h2, .sheet-head h2, .meal-title, .meal-hero-txt b, .mk-title,
  .pl-head h2, .dq h2, .dq-q, .list-total b, .detail-head h2 { font-weight: 650 !important; letter-spacing: -.01em; }

  /* header: a full-width green band (Whole Foods' store bar) */
  .top { background: var(--brand); color: #fff; margin: -24px 0 0; padding: 14px 0;
    box-shadow: 0 0 0 100vmax var(--brand); clip-path: inset(0 -100vmax); }
  .top { justify-content: flex-start; gap: 12px; }
  .count-pill { margin-left: auto; }
  .logo { color: #fff; font-size: 24px; }
  .logo span { color: #F3D9A4; }
  .count-pill { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: #fff; }
  .back-btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }

  /* tabs: quiet underline tabs instead of a pill switcher */
  .tabs { background: transparent; border: none; border-bottom: 1px solid var(--line); border-radius: 0;
    padding: 0; margin: 0 0 0; gap: 4px; overflow-x: auto; scrollbar-width: none; width: 100%; box-sizing: border-box; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border-radius: 0; background: none !important; color: var(--ink-soft); font-weight: 600;
    padding: 14px 12px 12px; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); }

  /* hero: food photo with the question and the search on top of it (EWG / Whole Foods) */
  .hero-search { position: relative; margin: 0 0 8px; padding: 64px 24px 58px; border-radius: 0 0 18px 18px;
    background: #1F3A2E;
    box-shadow: 0 0 0 100vmax transparent; }
  .hero-search { overflow: hidden; isolation: isolate; }
  .hero-bg { position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity 1.6s ease;
    background: linear-gradient(180deg, rgba(12,30,22,.25), rgba(12,30,22,.62)), var(--img) center var(--y, 55%) / cover; }
  .hero-bg.on { opacity: 1; }
  .hero-search::before { content: 'Real ingredients · real scores · ShopRite of Cardiff'; display: block;
    font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #F3D9A4; margin-bottom: 10px; }
  .hero-search h1 { color: #fff; font-size: 40px; line-height: 1.1; margin-bottom: 22px; text-shadow: 0 2px 18px rgba(0,0,0,.25); }
  .search-pill { border: none; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 16px 22px; }

  /* buttons: primary actions in brand green */
  .tab.active, .filter-toggle.on { color: var(--brand); }
  .filter-toggle.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .big-btn, .pl-add, .im-btn:not(.alt), .list-open-btn { background: var(--brand); }
  .big-btn:hover, .pl-add:hover, .im-btn:not(.alt):hover, .list-open-btn:hover { background: var(--brand-dark); }
  .filter-toggle, .profile-pick { border-color: var(--line); }

  /* cards: white on cream, softer corners, a thin line instead of a thick border */
  .card { border: 1px solid var(--line); border-radius: 14px; }
  .card:hover { box-shadow: 0 12px 28px rgba(15,90,67,.10); }
  .card-img { background: #F6F1E6; border-radius: 10px; }
  .card-brand { color: var(--brand); opacity: .8; }
  .card-name { font-weight: 500; font-size: 13.5px; }
  .grade-chip { font-family: var(--sans); font-weight: 700; }

  .detail-panel { border-radius: 18px; }
  .detail-name { font-family: var(--display); font-weight: 600; font-size: 17px; }
  .detail-brand, .detail-aisle { color: var(--brand); }
  .detail-score { font-family: var(--sans); font-weight: 800; width: 52px; height: 52px; flex-basis: 52px; font-size: 19px; }
  .detail-scale { margin: -4px 0 18px; }
  .detail-scale-bar { position: relative; height: 10px; border-radius: 999px; margin: 20px 10px 6px;
    background: linear-gradient(90deg, hsl(0,58%,45%), hsl(30,62%,48%), hsl(60,55%,42%), hsl(90,50%,40%), hsl(120,45%,36%)); }
  .detail-scale-pin { position: absolute; top: 50%; transform: translate(-50%, -50%); min-width: 30px; height: 30px; padding: 0 6px;
    border-radius: 999px; background: #fff; border: 2px solid var(--ink); display: grid; place-items: center;
    font-weight: 800; font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .detail-scale-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); padding: 0 4px; }
  .detail-row { background: #F6F1E6; }
  .detail-row-top { display: flex; justify-content: space-between; align-items: baseline; }
  .detail-row-num { font-weight: 800; font-size: 13px; color: var(--ink-soft); }
  .detail-row-bar { height: 5px; border-radius: 999px; background: #E7DFCF; margin: 4px 0 6px; overflow: hidden; }
  .detail-row-bar i { display: block; height: 100%; border-radius: 999px; }
  .detail-ings { margin: 0 0 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .detail-ings summary { display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    min-height: 44px; padding: 0 14px; font-weight: 700; font-size: 14px; list-style: none; }
  .detail-ings summary::-webkit-details-marker { display: none; }
  .detail-ings summary::after { content: '▾'; color: var(--ink-faint); margin-left: 8px; transition: transform .15s; }
  .detail-ings[open] summary::after { transform: rotate(180deg); }
  .detail-ings-n { margin-left: auto; font-weight: 500; font-size: 12.5px; color: var(--ink-faint); }
  .detail-ings[open] .detail-ings-n { visibility: hidden; }
  .detail-ings-body { padding: 0 14px 12px; font-size: 13.5px; line-height: 1.6; color: var(--ink); text-transform: lowercase; }
  .detail-ings-body::first-letter { text-transform: uppercase; }
  .detail-ings mark { background: #FBE3DC; color: #8E2A1E; border-radius: 4px; padding: 0 3px; cursor: help; }
  .detail-ings-key { padding: 0 14px 12px; font-size: 11.5px; color: var(--ink-faint); }
  .detail-ings-none { padding: 12px 14px; font-size: 13px; color: var(--ink-faint); }
  .meals-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .meals-actions .meals-more { margin: 0; min-height: 44px; border: 1px solid var(--line); }
  #mealsShuffle { background: var(--brand); color: #fff; border-color: var(--brand); }
  .detail-gap { background: #FBF3D6; color: #6E5410; border-radius: 12px; padding: 10px 13px; font-size: 12.5px; line-height: 1.45; margin: 0 0 14px; }
  .tab-list { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .tab-count { background: var(--brand); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 800;
    min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; }
  .tab-count[hidden] { display: none; }
  .pick-back { background: none; border: none; color: var(--brand); font: inherit; font-weight: 700; font-size: 14px;
    padding: 0; min-height: 40px; cursor: pointer; }
  .pick-count { font-size: 12px; color: var(--ink-faint); margin: 2px 2px 8px; }
  .pick-list { display: flex; flex-direction: column; gap: 8px; }
  .pick-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff;
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; font: inherit; color: var(--ink); }
  .pick-row:hover { border-color: var(--brand); }
  .pick-row.current { border-color: var(--brand); background: var(--brand-soft); }
  .pick-img { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 8px; background: #F6F1E6; display: grid; place-items: center; overflow: hidden; }
  .pick-img img { max-width: 90%; max-height: 90%; object-fit: contain; }
  .pick-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pick-rec { align-self: flex-start; background: var(--brand); color: #fff; font-size: 10.5px; font-weight: 800;
    letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; }
  .pick-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .pick-meta { font-size: 12px; color: var(--ink-faint); }
  .pick-more, .pick-text { display: block; width: 100%; margin-top: 10px; min-height: 44px; border: 1px dashed var(--line);
    background: none; border-radius: 12px; font: inherit; font-weight: 700; color: var(--brand); cursor: pointer; }
  .mk-actions { flex-wrap: wrap; gap: 10px; }
  .mk-recipe { flex: 1 1 100%; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px;
    background: #fff; border: 2px solid var(--brand); color: var(--brand); font-weight: 800; font-size: 15px; text-decoration: none; }
  .mk-recipe:hover { background: var(--brand-soft); }
  .scan-btn { display: inline-flex; align-items: center; gap: 8px; margin: 14px auto 0; min-height: 44px; padding: 0 18px;
    border-radius: 999px; border: 1.5px solid rgba(255,255,255,.75); background: rgba(255,255,255,.12); color: #fff;
    font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; backdrop-filter: blur(4px); }
  .scan-btn[hidden] { display: none; }
  .scan-btn:hover { background: rgba(255,255,255,.22); }
  .searched .scan-btn { margin-top: 10px; }
  .scan-wait { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 30px 10px; }
  .scan-wait b { font-size: 16px; } .scan-wait span { color: var(--ink-soft); font-size: 13.5px; line-height: 1.5; }
  .scan-wait .big-btn { margin-top: 10px; }
  .scan-tip { font-size: 12.5px !important; color: var(--ink-faint) !important; max-width: 320px; }
  .scan-spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--brand-soft); border-top-color: var(--brand); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scan-thumb { display: grid; place-items: center; color: var(--brand); }
  .scan-note { font-size: 12.5px; color: var(--ink-soft); background: var(--brand-soft); border-radius: 10px; padding: 9px 12px; line-height: 1.45; margin: 0 0 14px; }
  .scan-nut { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .scan-nut span { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; }
  .pl-sug { cursor: default; padding: 0 10px 0 0; }
  .pl-sug-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; background: none; border: none;
    padding: 9px 0 9px 10px; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .pl-plus { border: none; cursor: pointer; font-size: 20px; font-weight: 700; display: grid; place-items: center; background: var(--brand); width: 40px; height: 40px; }
  .pl-row u { text-decoration: none; color: var(--brand); font-weight: 700; }
  /* ---- theme v2, part 2 (overnight 2026-10-02): the list, dinner and planner screens
     still had v1's thick borders and heavy display-font numbers. */
  #dinnerTab, #planTab, #importTab { padding-top: 20px; }
  .dq-opt, .pl-row, .pl-sug, .pl-input, .add-item input, .im-box, .meals-more, .list-export button { border-width: 1px !important; border-color: var(--line); }
  .dq-opt { border-radius: 14px; transition: border-color .12s, background .12s; }
  .dq-opt:hover, .pl-sug:hover { border-color: var(--brand) !important; background: #fff; }
  .pl-input:focus, .im-box:focus, .add-item input:focus { border-color: var(--brand) !important; outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  .pl-sc, .mp-score, .li-score, .meal-score, .grade-chip { font-family: var(--sans) !important; font-weight: 800 !important; }
  .pl-sc, .mp-score { border-radius: 999px; min-width: 36px; }
  .pl-x { color: var(--ink-faint); }
  .add-item button { background: var(--brand); }
  .li { border-radius: 14px; }
  .li-check { border-color: #C9D4CD; border-radius: 7px; }
  .li.done .li-check { background: var(--brand); border-color: var(--brand); color: #fff; }
  .li-btn { border-radius: 999px; font-weight: 700; }
  /* The list is a floating pill: what's on it and its average score, one tap to open. */
  .list-bar { left: 50%; right: auto; bottom: calc(14px + env(safe-area-inset-bottom)); padding: 0; background: none;
    border: none !important; box-shadow: none; transform: translate(-50%, 160%); z-index: 40; }
  .list-bar.open { transform: translate(-50%, 0); }
  .list-pill { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 8px 8px 8px 18px; border: none;
    border-radius: 999px; background: var(--brand); color: #fff; font-family: var(--sans); cursor: pointer;
    box-shadow: 0 12px 30px rgba(15,90,67,.35), 0 2px 6px rgba(0,0,0,.12); white-space: nowrap; }
  .list-pill:hover { filter: brightness(1.08); }
  .lp-txt { text-align: left; font-size: 15px; font-weight: 700; line-height: 1.15; }
  .lp-txt small { display: block; font-size: 12px; font-weight: 500; opacity: .82; }
  .lp-score { min-width: 38px; height: 38px; padding: 0 6px; border-radius: 999px; background: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; }
  .lp-score[hidden] { display: none; }
  .list-bar.bump .list-pill { animation: lpBump .45s ease; }
  @keyframes lpBump { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .list-bar, .list-bar.bump .list-pill { transition: none; animation: none; } }
  .list-thumb { border: 1px solid var(--line); background: #F6F1E6; border-radius: 10px; }
  .list-summary { font-family: var(--sans) !important; }
  .aisle-head { color: var(--brand); }
  .dq-prog { color: var(--brand); }
  .pl-slot h3 { color: var(--brand); }
  .sheet-head h2 { font-size: 24px; }
  .searched .hero-search { padding: 18px 24px; border-radius: 0 0 14px 14px; }
  .searched .hero-search h1, .searched .hero-search::before { display: none; }
  .add-fab { background: var(--brand); }
  .add-fab:hover { background: var(--brand-dark); }
  .add-fab.added { background: var(--green); }

  .t-short { display: none; }
  @media (max-width: 600px) {
    .t-long { display: none; } .t-short { display: inline; }
    .tabs { justify-content: space-between; }
    .tab { padding: 13px 10px 11px; }
    .count-pill { display: none; }
    .hero-search::before { display: none !important; }
    .top { margin-top: -24px; }
    .hero-search { padding: 40px 16px 36px; border-radius: 0 0 14px 14px; }
    .hero-search h1 { font-size: 29px; }
    .hero-search::before { font-size: 10.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back-btn" id="backBtn" hidden aria-label="Go back">← Back</button>
    <div class="logo">grocery<span>scorer</span></div>
    <div class="count-pill" id="stat">loading…</div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="shop" role="tab">Shop</button>
    <button class="tab" data-tab="dinner" role="tab"><span class="t-long">What's for dinner?</span><span class="t-short">Dinner</span></button>
    <button class="tab" data-tab="plan" role="tab"><span class="t-long">Plan my week</span><span class="t-short">My week</span></button>

  <div id="shopTab">

      <input id="q" type="text" placeholder="peanut butter, yogurt, brands…" autocomplete="off" enterkeyhint="search">
    </div>
    <button class="scan-btn" id="scanBtn" type="button" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Scan a label
    </button>

</div>

  </div>
