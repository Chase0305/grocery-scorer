  if (e.target.closest('#imCopyShortcut')) return copyText(shortcutCode(SHARE_LAN ? `http://${SHARE_LAN}:${location.port || 80}` : location.origin));
  if (e.target.closest('#imCopyBookmarklet')) return copyText(bookmarkletCode(location.origin));
  if (e.target.closest('.im-bookmarklet')) { e.preventDefault(); return toast('Drag it to your bookmarks bar - it runs on recipe pages, not here'); }
  const sw = e.target.closest('[data-im-swap]');
  if (sw) { const i = +sw.dataset.imSwap; IMPORT.open = IMPORT.open === i ? null : i; return renderImportResult(); }
  const pk = e.target.closest('[data-im-pick]');
  if (pk) { const [i, sku] = pk.dataset.imPick.split('|'); IMPORT.rows[+i].pick = sku; IMPORT.open = null; return renderImportResult(); }
  if (e.target.closest('#imAdd')) return importAdd();
}
function importChange(e) {
  const inc = e.target.closest('[data-im-inc]');
  if (inc) { IMPORT.rows[+inc.dataset.imInc].include = inc.checked; return renderImportResult(); }
  const t = e.target.closest('[data-im-term]');
  if (t) { const r = IMPORT.rows[+t.dataset.imTerm]; r.term = t.value.trim(); r.pick = null; importRematch(r); r.include = !!r.alts.length; return renderImportResult(); }
  if (e.target.id === 'imSkip') {
    IMPORT.skipStaples = e.target.checked;
    IMPORT.rows.forEach(r => { if (r.staple) r.include = !IMPORT.skipStaples && !!r.alts.length; });
    return renderImportResult();
  }
}

/* ------------------------------------------------------------ back button
   A phone's Back gesture used to leave the whole site, because every screen
   here (tabs, the shopping list / meal sheet, the product breakdown) is the
   same page. Each of those now pushes one history entry when it opens, so
   Back closes the top layer instead. `NAV.stack` mirrors the entries we
   pushed; `skip` counts the popstates we caused ourselves with history.back()
   so they are not handled twice. */
const NAV = { stack: [], skip: 0, restoring: false, tab: 'shop' };
function navPush(entry) {
  NAV.stack.push(entry);
  try { history.pushState({ gs: NAV.stack.length }, ''); } catch (e) {}
  navUpdate();
}
function navUpdate() {
  const b = document.getElementById('backBtn');
  if (b) b.hidden = NAV.stack.length === 0;
}
// A layer was closed by something other than Back (the X, the backdrop, Escape).
function navClosedByUI(kind) {
  const i = NAV.stack.map(e => e.kind).lastIndexOf(kind);
  if (i < 0) return;                        // Back itself closed it; already handled
  if (i === NAV.stack.length - 1) { NAV.stack.pop(); NAV.skip++; try { history.back(); } catch (e) {} }
  else NAV.stack.splice(i, 1);              // buried: drop it, leaving one harmless extra entry
  navUpdate();
}
function navWatch(id, kind) {
  const el = document.getElementById(id);
  let open = !el.hidden;
  new MutationObserver(() => {
    const now = !el.hidden;
    if (now === open) return;
    open = now;
    if (now) navPush({ kind }); else navClosedByUI(kind);
  }).observe(el, { attributes: true, attributeFilter: ['hidden'] });
}
window.addEventListener('popstate', e => {
  if (NAV.skip > 0) { NAV.skip--; return; }
  const top = NAV.stack.pop();
  if (!top) {
    // An entry left over from before a reload: keep going rather than appear stuck.
    if (e.state && e.state.gs > 0) { NAV.skip++; try { history.back(); } catch (err) {} }
    return;
  }
  if (top.kind === 'detail') document.getElementById('detailOverlay').hidden = true;
  else if (top.kind === 'sheet') { document.getElementById('listSheet').hidden = true; SWAP_OPEN = null; CLEAR_ARMED = false; LIST_PICK = null; }
  else if (top.kind === 'tab') { NAV.restoring = true; setTab(top.prev); NAV.restoring = false; }
  navUpdate();
});

function setTab(name) {
  if (!NAV.restoring && name !== NAV.tab) {
    const top = NAV.stack[NAV.stack.length - 1];
    // Tapping the tab you just came from is just Back.
    if (top && top.kind === 'tab' && top.prev === name) {
      // Undo the step now rather than waiting for popstate, so quick taps can't race it.
      NAV.stack.pop(); NAV.skip++; try { history.back(); } catch (e) {}
      NAV.restoring = true; setTab(name); NAV.restoring = false; navUpdate();
      return;
    }
    // Hopping between tabs keeps ONE step: Back goes to where you started, not
    // through every tab you passed (60 switches used to mean 60 Backs).
    if (!(top && top.kind === 'tab')) navPush({ kind: 'tab', prev: NAV.tab });
  }
  NAV.tab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.getElementById('shopTab').hidden = name !== 'shop';
  document.getElementById('dinnerTab').hidden = name !== 'dinner';
  document.getElementById('planTab').hidden = name !== 'plan';
  document.getElementById('importTab').hidden = name !== 'import';
  if (name === 'dinner') renderDinner();
  if (name === 'plan') renderPlan();
  if (name === 'import') renderImport();
  window.scrollTo(0, 0);
}

function dinnerClick(e) {
  const opt = e.target.closest('[data-dq]');
  if (opt) {
    const d = DQ[DINNER.step];
    DINNER.answers[d.key] = opt.dataset.dq === '__any' ? null : opt.dataset.dq;
    DINNER.trail.push(DINNER.step);
    DINNER.step++;
    renderDinner(); return true;
  }
  if (e.target.closest('#dqBack')) {
    // Back goes to the last question they answered, not the last one numbered.
    DINNER.step = DINNER.trail.pop() ?? 0;
    delete DINNER.answers[DQ[DINNER.step].key];
    renderDinner(); return true;
  }
  if (e.target.closest('#dqReset')) { DINNER = { answers: {}, step: 0, trail: [] }; renderDinner(); return true; }
  if (e.target.closest('#dqShow')) { DINNER.step = DQ.length; renderDinner(); return true; }
  const undo = e.target.closest('[data-dq-undo]');
  if (undo) {
    // Going back to a question means forgetting it and everything after it.
    const i = DQ.findIndex(d => d.key === undo.dataset.dqUndo);
    DQ.slice(i).forEach(d => delete DINNER.answers[d.key]);
    DINNER.trail = DINNER.trail.filter(t => t < i);
    DINNER.step = i; renderDinner(); return true;
  }
  if (e.target.closest('#dqSurprise')) {
    const pool = dinnerMatches(DINNER.answers);
    renderMeal(pool[Math.floor(Math.random() * pool.length)].id); return true;
  }
  const meal = e.target.closest('[data-meal]');
  if (meal) { renderMeal(meal.dataset.meal); return true; }
  return false;
}

/* Tapping a meal used to dump its ingredients straight onto the list and throw
   the list open, which made the list look like that meal's own checklist. It
   opens a preview instead: here is what this meal would put on your list, one
   button to send it there. The list stays the single place you shop from. */
/* Amounts are rough buy-for-two figures (meals.json `amounts`, parallel to
   `items`). When several meals need the same ingredient the notes are joined
   ("1 lb + 1.5 lb") rather than summed: the units differ too often to add. */
function mealAmount(meal, i) { return (meal.amounts && meal.amounts[i]) || ''; }
/* Each list line remembers WHICH meal asked for how much (e.amts: meal id -> "1 can"), so
   adding a meal twice changes nothing and two meals that each need a can make "2 cans".
   Amounts in the same unit are added; different units are listed side by side. */
const AMT_NOUNS = { cup: 'cups', slice: 'slices', clove: 'cloves', can: 'cans', handful: 'handfuls', stalk: 'stalks',
  crown: 'crowns', leaf: 'leaves', chop: 'chops', roll: 'rolls', head: 'heads', heart: 'hearts', bunch: 'bunches',
  jar: 'jars', bag: 'bags', box: 'boxes', bottle: 'bottles', pack: 'packs', pint: 'pints', tub: 'tubs', block: 'blocks' };
const AMT_SINGULAR = { ...Object.fromEntries(Object.entries(AMT_NOUNS).map(([a, b]) => [b, a])), lbs: 'lb', pounds: 'lb', pound: 'lb' };  // "1 lb" + "1.5 lbs" = "2 1/2 lb"
function parseAmount(t) {
  const m = /^(\d+(?:\.\d+)?)(?:\s+(\d+)\/(\d+)|\/(\d+))?\s*(.*)$/.exec(String(t).trim());
  if (!m) return null;
  let n = parseFloat(m[1]);
  if (m[2]) n += +m[2] / +m[3];
  else if (m[4]) n = n / +m[4];
  const words = m[5].toLowerCase().split(' ');
  words[0] = AMT_SINGULAR[words[0]] || words[0];
  return { n, unit: words.join(' ').trim() };
}
function fmtAmount(n, unit) {
  const whole = Math.floor(n + 1e-9), frac = n - whole;
  const F = [[0.25, '1/4'], [0.333, '1/3'], [0.5, '1/2'], [0.667, '2/3'], [0.75, '3/4']].find(([v]) => Math.abs(frac - v) < 0.02);
  const num = frac < 0.02 ? String(whole) : F ? (whole ? whole + ' ' : '') + F[1] : String(Math.round(n * 10) / 10);
  const words = unit.split(' ');
  if (n > 1 && AMT_NOUNS[words[0]]) words[0] = AMT_NOUNS[words[0]];
  return (num + ' ' + words.join(' ')).trim();
}
function sumAmounts(list) {
  const totals = new Map(), other = [];
  for (const a of list) {
    const p = parseAmount(a);
    if (!p) { if (!other.includes(a)) other.push(a); continue; }
    totals.set(p.unit, (totals.get(p.unit) || 0) + p.n);
  }
  return [...[...totals].map(([u, n]) => fmtAmount(n, u)), ...other].join(' + ');
}
// Record what one source (a meal id) needs on a list line, and re-derive the note.
function addAmount(e, key, amount) {
  if (!amount) return;
  e.amts = e.amts || (e.note ? { _: e.note } : {});      // keep an amount that came from a recipe import
  e.amts[key] = amount;
  e.note = sumAmounts(Object.values(e.amts)).slice(0, 60);
  const meals = Object.keys(e.amts).filter(k => k !== '_').length;
  if (meals > 1) e.uses = Math.max(e.uses || 1, meals);
}
function mealParts(meal) {
  return meal.items.map((q, i) => {
    const p = GS.bestFor(q, FILTERS, 1)[0] || null;
    return { q, amount: mealAmount(meal, i), p, score: p ? GS.scoreFor(p.sku) : null,
             already: MY_LIST.some(e => e.q === q) };
  });
}

function renderMeal(id) {
  const meal = MEALS.find(m => m.id === id);
  if (!meal) return;
  const parts = mealParts(meal);
  const scores = parts.map(x => x.score).filter(v => v != null);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  const toAdd = parts.filter(x => !x.already).length;

  const sheet = document.getElementById('listSheet');
  SHEET_MODE = 'meal';
  sheet.innerHTML = `
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <button class="sheet-close" aria-label="Close">✕</button>
        <h2>${meal.title}</h2>
        <p>${meal.items.length} ingredients${avg != null ? ` · ${avg} average score` : ''}</p>
      </div>
      <div class="sheet-body">
        <div class="meal-hero">
          ${meal.image ? `<img src="${meal.image}" alt="">` : ''}
          <div class="meal-hero-scrim"></div>
          <div class="meal-hero-txt"><b>${meal.title}</b><span>${meal.subtitle}</span></div>
        </div>
        <div class="mp-head">
          <span>What this would put on your list</span>
          ${avg != null ? `<span><b style="color:${GS.scoreColor(avg)}">${avg}</b> avg</span>` : ''}
        </div>
        ${parts.map(x => `
          <div class="mp-row">
            <div class="mp-score ${x.score == null ? 'none' : ''}" ${x.score != null ? `style="background:${GS.scoreColor(x.score)}"` : ''}>${x.score == null ? '—' : Math.round(x.score)}</div>
            <div class="mp-main">
              <div class="mp-want">${x.q}${x.amount ? ` <span class="mp-amt">${esc(x.amount)}</span>` : ''}</div>
              <div class="mp-pick">${x.p ? x.p.name : 'nothing scored matched'}${x.p && GS.priceFor(x.p.sku) ? ` · ${GS.priceFor(x.p.sku)}` : ''}</div>
            </div>
            ${x.already ? '<div class="mp-on">on your list</div>' : ''}
          </div>`).join('')}
        <a class="mk-recipe" href="recipe.html?meal=${encodeURIComponent(meal.id)}" style="margin:6px 0 10px">How to make it →</a>
        <button class="big-btn" data-meal-add="${meal.id}" ${toAdd ? '' : 'disabled'}>
          ${toAdd ? `Add ${toAdd} ingredient${toAdd === 1 ? '' : 's'} to shopping list` : 'Already on your shopping list'}
        </button>
        ${meal.amounts ? '<div class="profile-note">Amounts are rough, for two people, and will come onto your list as a note. Adjust to taste.</div>' : ''}
        <div class="profile-note">These go onto your one shopping list, the same one search
          adds to — not a separate checklist for this meal. Each pick is the best-scoring
          product that passes your filters, and you can swap any of them on the list.</div>
      </div>
    </div>`;
  sheet.hidden = false;
}

function addMeal(id) {
  const meal = MEALS.find(m => m.id === id);
  if (!meal) return;
  let added = 0;
  meal.items.forEach((q, i) => {
    const amount = mealAmount(meal, i);
    // Don't duplicate something already on the list under the same name -
    // but if another meal put it there, keep both meals' amounts.
    const ex = MY_LIST.find(e => e.q === q);
    if (ex) { if (!(ex.amts && meal.id in ex.amts)) addAmount(ex, meal.id, amount); return; }
    const best = GS.bestFor(q, FILTERS, 1);
    const entry = { q, sku: best.length ? best[0].sku : null, checked: false };
    addAmount(entry, meal.id, amount);
    MY_LIST.push(entry);
    added++;
  });
  GS.saveMyList(MY_LIST);              // also saves amounts added to lines already on the list
  renderListBar();
  toast(added
    ? `${added} ingredient${added === 1 ? '' : 's'} added to your shopping list`
    : 'Everything was already on your list');
  openList();
}

/* ------------------------------------------------------- buy it or make it
   Two honest numbers side by side: the best store version, and the average
   score of the things you would buy to make it instead. The second is NOT
   "homemade scores 96" - there is no such product to score. It is the score
   of the actual ingredients, which is a fact, and the ingredient lists below
   it are what really makes the case.

   Cost per batch comes from each ingredient's real unit price times the
   fraction of the package a batch uses, so it is an estimate with its
   arithmetic shown rather than a claim. */
let MAKEABLE = [];

function makeParts(item) {
  const store = GS.bestFor(item.store_query, FILTERS, 1)[0] || null;
  const parts = item.ingredients.map(ing => {
    const p = GS.bestFor(ing.q, FILTERS, 1)[0] || null;
    const u = p ? GS.unitPrice(p.sku) : null;
    const priceStr = p ? GS.priceFor(p.sku) : null;
    const full = priceStr ? parseFloat(String(priceStr).replace(/[^0-9.]/g, '')) : null;
    return { ing, p, score: p ? GS.scoreFor(p.sku) : null,
             batchCost: (full != null && isFinite(full)) ? full * ing.uses : null };
  });
  const scores = parts.map(x => x.score).filter(v => v != null);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const costs = parts.map(x => x.batchCost).filter(v => v != null);
  return { store, storeScore: store ? GS.scoreFor(store.sku) : null, parts, avg,
           batchCost: costs.length === parts.length ? costs.reduce((a,b)=>a+b,0) : null };
}

function renderMakeShelf() {
  if (!MAKEABLE.length) return '';
  /* Two groups, because they answer different questions. "Buy it or make it"
     is a close call worth thinking about. "Nothing good here" is a category
     where the app's usual job - find you the best one - has no useful answer,
     because the best one is still bad. */
  return makeGroup(MAKEABLE.filter(m => !m.no_good_option),
      'Buy it or make it',
      'Where the store version and the version you would make are furthest apart.')
    + makeGroup(MAKEABLE.filter(m => m.no_good_option),
      'Nothing good here',
      'Categories where even the best product in the store scores badly — so the honest answer is a recipe.');
}

function makeGroup(items, heading, sub) {
  if (!items.length) return '';
  return `<div class="meals">
    <div class="meals-head">${heading}</div>
    <div class="meals-sub">${sub}</div>
    <div class="mk-grid">
      ${items.map(m => {
        const r = makeParts(m);
        return `<button class="mk-card" data-make="${m.id}">
          <div class="mk-title">${m.title}</div>
          <div class="mk-vs">
            ${r.storeScore != null ? `<span class="mk-pill" style="background:${GS.scoreColor(r.storeScore)}">${Math.round(r.storeScore)}</span>` : ''}
            <span class="mk-arrow">→</span>
            ${r.avg != null ? `<span class="mk-pill" style="background:${GS.scoreColor(r.avg)}">${r.avg}</span>` : ''}
            <span class="mk-note">buy vs make</span>
          </div>
          <div class="mk-note">${m.effort}</div>
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

            <div class="cmp-name">${r.store ? r.store.name : 'nothing scored found'}</div>

            ${storeIngs ? `<div class="cmp-ings">${storeIngs}</div>` : ''}

            <div class="cmp-meta">${r.batchCost != null

            <div class="cmp-ings">

               </div>`).join('')}

function addMakeIngredients(id) {
  const item = MAKEABLE.find(m => m.id === id);
  if (!item) return;
  let added = 0;
  item.ingredients.forEach(ing => {
    if (MY_LIST.some(e => e.q === ing.q)) return;
    const best = GS.bestFor(ing.q, FILTERS, 1);
    MY_LIST.push({ q: ing.q, sku: best.length ? best[0].sku : null, checked: false });
    added++;
  });
  if (added) GS.saveMyList(MY_LIST);
  renderListBar();
  toast(added
    ? `${added} ingredient${added === 1 ? '' : 's'} added to your shopping list`
    : 'Everything was already on your list');
  openList();
}

function onList(sku) { return MY_LIST.some(e => e.sku === sku); }

function renderListBar() {
  const cnt = document.getElementById('listTabCount');
  if (cnt) { cnt.textContent = MY_LIST.length; cnt.hidden = !MY_LIST.length; }
  const bar = document.getElementById('listBar');
  bar.classList.toggle('open', MY_LIST.length > 0);
  if (!MY_LIST.length) { if (!document.getElementById('listSheet').hidden) renderListSheet(); return; }
  // A pill, not a strip of thumbnails: at phone size a dozen 46 px photos were too small
  // to recognise and their remove buttons got clipped. The list tab and sheet do that job.
  const picked = MY_LIST.filter(e => e.sku).map(e => GS.product(e.sku)).filter(Boolean);
  const scored = picked.map(p => GS.scoreFor(p.sku)).filter(s => s != null);
  const n = MY_LIST.length, left = MY_LIST.filter(e => !e.checked).length;
  document.getElementById('listSummary').innerHTML = `My list<small>${n} item${n===1?'':'s'}${left < n ? ` · ${left} to get` : ''}</small>`;
  const sc = document.getElementById('listScore');
  if (scored.length) {
    const avg = Math.round(scored.reduce((a,b)=>a+b,0)/scored.length);
    sc.textContent = avg; sc.style.color = GS.scoreColor(avg); sc.title = 'Average score'; sc.hidden = false;
  } else sc.hidden = true;
  if (n > (renderListBar.last || 0)) { bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump'); }
  renderListBar.last = n;
  if (!document.getElementById('listSheet').hidden) renderListSheet();
}

/* ------------------------------------------------------------ shopping list
   You shop for "peanut butter", not for a barcode. Adding an item by name
   picks the best-scoring product that passes your filters, shows why, and
   lets you swap it - the pick is a suggestion, not a decision.

   Grouped by aisle because that is the order you walk the store in. The
   grouping is honest about ShopRite's patchy aisle data (see README): a real
   aisle when there is one, otherwise the department. */
let SWAP_OPEN = null;   // index of the row whose alternatives are expanded

/* The sheet is one container showing three different things. Without this,
   any renderListBar() while a meal or comparison was open would quietly
   replace it with the shopping list. */
let SHEET_MODE = 'list';

/* Clearing is two taps on purpose: one tap arms the button, a second confirms.
   A list built from a whole meal is several minutes of work, and a stray tap
   with a thumb on a phone is exactly how it would get wiped. */
let CLEAR_ARMED = false, CLEAR_T;
function clearList() {
  if (!MY_LIST.length) return;
  if (!CLEAR_ARMED) {
    CLEAR_ARMED = true;
    renderListSheet();
    clearTimeout(CLEAR_T);
    CLEAR_T = setTimeout(() => { CLEAR_ARMED = false; renderListSheet(); }, 4000);
    return;
  }
  clearTimeout(CLEAR_T);
  CLEAR_ARMED = false;
  SWAP_OPEN = null;
  MY_LIST = [];
  GS.saveMyList(MY_LIST);
  renderListBar();
  renderListSheet();
  renderResults(document.getElementById('q').value, false);
  toast('List cleared');
}

function openList() {
  SHEET_MODE = 'list';
  LIST_PICK = null;
  const sheet = document.getElementById('listSheet');
  sheet.hidden = false;
  sheet.dataset.view = '';      // opening fresh starts at the top
  renderListSheet();
}

let TOAST_T;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => el.classList.remove('show'), 2600);
}

/* Getting the list off this website and into whatever they actually hold in
   the store. Grouped the same way the on-screen list is, because that is the
   order you walk the aisles in. */
function listAsText() {
  const groups = new Map();
  MY_LIST.forEach(e => {
    const g = e.sku ? GS.aisleGroup(e.sku) : 'Other';
    if (!groups.has(g)) groups.set(g, []);
    const p = e.sku ? GS.product(e.sku) : null;
    const price = p ? GS.priceFor(p.sku) : null;
    groups.get(g).push(`- ${p ? p.name : (e.q || 'item')}${price ? ` (${price})` : ''}`);
  });
  const names = [...groups.keys()].sort((a, b) =>
    a === 'Other' ? 1 : b === 'Other' ? -1 : a.localeCompare(b));
  return 'Shopping list\n\n' + names.map(n => `${n}\n${groups.get(n).join('\n')}`).join('\n\n');
}

async function exportList(mode) {
  const text = listAsText();
  if (!MY_LIST.length) { toast('Nothing on the list yet'); return; }
  if (mode === 'share' && navigator.share) {
    // The OS share sheet is what reaches Notes, Reminders, Messages - there is
    // no import URL for Apple Notes, so this is the honest route.
    try { await navigator.share({ title: 'Shopping list', text }); }
    catch (err) { /* cancelling the share sheet throws; that is not an error */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('List copied — paste it into Notes');
  } catch (err) {
    // clipboard needs a secure context; localhost qualifies, but not every browser agrees
    window.prompt('Copy your shopping list:', text);
  }
}

/* Adding by name used to drop the best-scoring product straight onto the list. That
   decided for you - "olive oil" became one particular bottle. Now it opens a picker in the
   same pop-up: every match, best score first, the top one tagged Recommended, and nothing
   goes on the list until you tap one. Swap on a list line opens the same picker. */
let LIST_PICK = null;          // { q, n, replace: list index or null } while picking
function addItemByName(query) {
  const q = (query || '').trim();
  if (!q) return;
  LIST_PICK = { q, n: 30, replace: null };
  renderListSheet();
  const body = document.querySelector('#listSheet .sheet-body'); if (body) body.scrollTop = 0;
}
function renderPicker() {
  const { q, n, replace } = LIST_PICK;
  const { kept, hidden } = GS.applyFilters(GS.search(q), FILTERS);
  const relaxed = GS.relaxedWord();
  const rec = (GS.bestFor(q, FILTERS, 1)[0] || {}).sku;
  const onList = new Set(MY_LIST.map(e => e.sku).filter(Boolean));
  const current = replace != null ? (MY_LIST[replace] || {}).sku : null;
  if (!kept.length) return `<div class="list-empty">No products match "${esc(q)}"${hidden ? ` (${hidden} hidden by your filters)` : ''}.<br>
      Try a simpler word - "yogurt" rather than "vanilla bean yogurt".</div>
    ${replace == null ? `<button class="pick-text" data-pick-text>Add "${esc(q)}" to the list anyway</button>` : ''}`;
  const rows = kept.slice(0, n).map(p => {
    const sc = GS.scoreFor(p.sku), u = GS.unitPrice(p.sku), price = GS.priceFor(p.sku);
    return `<button class="pick-row ${p.sku === current ? 'current' : ''}" data-pick="${p.sku}">
      <span class="pick-img">${p.image_url ? `<img src="${esc(p.image_url)}" alt="" loading="lazy">` : ''}</span>
      <span class="pick-main">
        ${p.sku === rec ? '<span class="pick-rec">Recommended</span>' : ''}
        <span class="pick-name">${esc(p.name)}</span>
        <span class="pick-meta">${price ? esc(price) : ''}${u ? ` · $${u.perOz.toFixed(2)}/${u.unit}` : ''}${p.sku === current ? ' · your current pick' : (onList.has(p.sku) ? ' · on your list' : '')}</span>
      </span>
      <span class="li-score ${sc == null ? 'none' : ''}" ${sc != null ? `style="background:${GS.scoreColor(sc)}"` : ''}>${sc == null ? '—' : Math.round(sc)}</span>
    </button>`;
  }).join('');
  return `${relaxed ? `<div class="relaxed">Nothing matched all of that, so we dropped <b>"${esc(relaxed)}"</b> and searched for the rest.</div>` : ''}
    <div class="pick-count">${kept.length} product${kept.length === 1 ? '' : 's'}, best score first${hidden ? ` · ${hidden} hidden by your filters` : ''}</div>
    <div class="pick-list">${rows}</div>
    ${kept.length > n ? `<button class="pick-more" data-pick-more>Show ${Math.min(30, kept.length - n)} more</button>` : ''}`;
}

function renderListSheet() {
  const sheet = document.getElementById('listSheet');
  if (sheet.hidden || SHEET_MODE !== 'list') return;

  let body;
  if (LIST_PICK) {
    body = renderPicker();
  } else if (!MY_LIST.length) {
    body = `<div class="list-empty">Nothing on the list yet.<br>
      Search for what you need above — "peanut butter", "greek yogurt" — and pick
      from every match, best score first.</div>`;
  } else {
    // Group by aisle, keeping the order items were added within each group.
    const groups = new Map();
    MY_LIST.forEach((e, i) => {
      const g = e.sku ? GS.aisleGroup(e.sku) : 'Not found';
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(i);
    });
    // Unfound items last; everything else alphabetical so the order is stable.
    const names = [...groups.keys()].sort((a, b) =>
      a === 'Not found' ? 1 : b === 'Not found' ? -1 : a.localeCompare(b));

    body = names.map(name => `
      <div class="aisle-group">
        <div class="aisle-head">${name}</div>
        ${groups.get(name).map(i => listRow(i)).join('')}
      </div>`).join('');

    const scored = MY_LIST.map(e => e.sku ? GS.scoreFor(e.sku) : null).filter(v => v != null);
    const left = MY_LIST.filter(e => !e.checked).length;
    body += `<div class="list-total">
      <span>${left} left to get${left !== MY_LIST.length ? ` · ${MY_LIST.length - left} got` : ''}</span>
      ${scored.length ? `<span><b style="color:${GS.scoreColor(scored.reduce((a,b)=>a+b,0)/scored.length)}">${Math.round(scored.reduce((a,b)=>a+b,0)/scored.length)}</b> avg score</span>` : ''}
    </div>`;
  }

  // Keep the scroll position when the same view re-renders (ticking an item, the first tap on
  // "Clear list"), so a confirm button at the bottom doesn't jump back to the top.
  const view = LIST_PICK ? 'pick:' + LIST_PICK.q : 'list';
  const prevBody = sheet.querySelector('.sheet-body');
  const keep = prevBody && sheet.dataset.view === view ? prevBody.scrollTop : null;
  sheet.innerHTML = `
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <button class="sheet-close" aria-label="Close">✕</button>
        ${LIST_PICK ? `<button class="pick-back" data-pick-back>← Back to list</button>
          <h2>${LIST_PICK.replace != null ? 'Swap' : 'Pick'}: ${esc(LIST_PICK.q)}</h2>
          <p>Every match, best score first. Tap one to ${LIST_PICK.replace != null ? 'use it instead' : 'add it to your list'}.</p>`
        : `<h2>Shopping list</h2>
          <p>Your one list — meals, comparisons and search all add here. Tick items off as you shop.</p>`}
      </div>
      <div class="sheet-body">
        <div class="add-item">
          <input id="addItemInput" placeholder="Search to add — milk, bread, olive oil…" autocomplete="off" enterkeyhint="search" value="${LIST_PICK ? esc(LIST_PICK.q) : ''}">
          <button id="addItemBtn">Search</button>
        </div>
        ${body}
        ${MY_LIST.length && !LIST_PICK ? `<div class="list-export">
          <button data-export="share">${navigator.share ? 'Send to Notes / other app' : 'Copy list'}</button>
          ${navigator.share ? '<button data-export="copy">Copy</button>' : ''}
        </div>
        <div class="list-export">
          <button class="clear-btn ${CLEAR_ARMED ? 'armed' : ''}" data-clear>${CLEAR_ARMED ? `Tap again to remove all ${MY_LIST.length}` : 'Clear list'}</button>
        </div>` : ''}
      </div>
    </div>`;
  sheet.dataset.view = view;
  if (keep != null) { const nb = sheet.querySelector('.sheet-body'); if (nb) nb.scrollTop = keep; }
}

function listRow(i) {
  const e = MY_LIST[i];
  const p = e.sku ? GS.product(e.sku) : null;
  const score = e.sku ? GS.scoreFor(e.sku) : null;
  const u = e.sku ? GS.unitPrice(e.sku) : null;
  const price = e.sku ? GS.priceFor(e.sku) : null;

  const swap = SWAP_OPEN === i && e.q ? `
    <div class="swap-row">
      ${GS.bestFor(e.q, FILTERS, 5).map(alt => {
        const s = GS.scoreFor(alt.sku);
        return `<div class="swap-opt ${alt.sku === e.sku ? 'current' : ''}" data-swap="${i}" data-sku="${alt.sku}">
          <div class="li-score ${s == null ? 'none' : ''}" ${s != null ? `style="background:${GS.scoreColor(s)}"` : ''}>${s == null ? '—' : Math.round(s)}</div>
          <div class="li-main"><div class="li-name">${esc(alt.name)}</div>
            <div class="li-meta">${GS.priceFor(alt.sku) || ''}</div></div>
        </div>`;
      }).join('')}
    </div>` : '';

  if (!p) {
    return `<div class="li" data-i="${i}">
      <button class="li-check" data-check="${i}"></button>
      <div class="li-main"><div class="li-want">${esc(e.q || 'item')}</div>
        <div class="li-meta">No scored product matched — try a different word.</div></div>
      <div class="li-right"><button class="li-btn" data-remove="${i}">Remove</button></div>
    </div>`;
  }

  return `<div class="li ${e.checked ? 'done' : ''}" data-i="${i}">
      <button class="li-check" data-check="${i}">${e.checked ? '✓' : ''}</button>
      <div class="li-img">${p.image_url ? `<img src="${p.image_url}">` : ''}</div>
      <div class="li-main">
        ${e.q ? `<div class="li-want">${esc(e.q)}</div>` : ''}
        <div class="li-name">${esc(p.name)}</div>
        <div class="li-meta">${price || ''}${u ? ` · $${u.perOz.toFixed(2)}/${u.unit}` : ''}${e.uses > 1 ? ` · needed for ${e.uses} meals` : ''}${e.note ? ` · ${esc(e.note)}` : ''}</div>
      </div>
      <div class="li-right">
        <div class="li-score ${score == null ? 'none' : ''}" ${score != null ? `style="background:${GS.scoreColor(score)}"` : ''}>${score == null ? '—' : Math.round(score)}</div>
        ${e.q ? `<button class="li-btn" data-swapbtn="${i}">${SWAP_OPEN === i ? 'Close' : (e.pinned ? 'Your pick' : 'Swap')}</button>` : ''}
        <button class="li-btn" data-remove="${i}">✕</button>
      </div>
    </div>${swap}`;
}

/* Cover photos: the user picked these four (2026-10-02) - burrito bowl, yogurt parfait,
   berries and oats, farm produce on marble. One is chosen at random per visit and the
   rest crossfade in every 8 s while the Shop tab's landing is showing. Two layers swap so
   the change is a fade, not a jump. Stops for a search, and never moves for people who
   ask their device for reduced motion. ?hero=<meal id> still previews a single photo. */
const HERO_PHOTOS = [
  { img: 'assets/meals/burritobowl.jpg', y: 58 },   // hero 'A' as picked; the photo moved here from greekbowl.jpg 2026-10-03
  { img: 'assets/meals/parfait.jpg', y: 60 },
  { img: 'assets/meals/oats.jpg', y: 50 },
  { img: 'assets/hero/produce-marble.jpg', y: 50 },
];
(function heroRotate() {
  const a = document.getElementById('heroBgA'), b = document.getElementById('heroBgB');
  if (!a || !b) return;
  const preview = new URLSearchParams(location.search).get('hero');
  const list = preview ? [{ img: `assets/meals/${preview.replace(/[^a-z]/g, '')}.jpg`, y: 55 }] : HERO_PHOTOS;
  const set = (el, p) => { el.style.setProperty('--img', `url('${p.img}')`); el.style.setProperty('--y', p.y + '%'); };
  let i = Math.floor(Math.random() * list.length), front = a;
  set(a, list[i]); a.classList.add('on');
  // Load the next one ahead so a fade never shows a half-loaded image.
  list.forEach(p => { const im = new Image(); im.src = p.img; });
  if (list.length < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(() => {
    if (document.hidden || document.body.classList.contains('searched')) return;
    if (document.getElementById('shopTab').hidden) return;
    i = (i + 1) % list.length;
    const back = front === a ? b : a;
    set(back, list[i]); back.classList.add('on'); front.classList.remove('on'); front = back;
  }, 8000);
})();

// Offline support (sw.js) once hosted on https. Not on the laptop's localhost by default: there
// it would serve the previous night's data for one load after every rebuild. ?sw=1 tests it locally.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || (location.hostname === 'localhost' && /[?&]sw=1/.test(location.search)))) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

(async function init() {
  const info = await GS.loadData();
  const scoredTotal = info.scoredCount + info.broaderScoredCount;
  document.getElementById('stat').textContent = `${info.totalCount.toLocaleString()} products · ${scoredTotal.toLocaleString()} scored`;
  MY_LIST = GS.loadMyList();
  renderListBar();

  try {
    MEALS = (await (await fetch('/data/meals.json', { cache: 'no-store' })).json()).meals || [];
  } catch (e) { MEALS = []; }
  try {
    MAKEABLE = (await (await fetch('/data/makeable.json', { cache: 'no-store' })).json()).items || [];
  } catch (e) { MAKEABLE = []; }
  // The results box ships with a static empty state, and renderResults was
  // only ever called on input - so the meal shelf never appeared on load.
  performance.mark('app:before-first-render');
  renderResults(document.getElementById('q').value || '');
  performance.mark('app:first-render-done');
  handleShare();
  window.addEventListener('hashchange', handleShare);

  renderProfilePanel();
  document.getElementById('results').addEventListener('click', e => {
    if (!e.target.closest('[data-price-off]')) return;
    e.preventDefault();
    // Same path as picking it in the panel, so the list re-picks too.
    document.querySelector('#profilePanel [data-price="off"]').click();
  });
  document.getElementById('profileBtn').addEventListener('click', () => {
    const panel = document.getElementById('profilePanel');
    panel.hidden = !panel.hidden;
  });
  document.getElementById('profilePanel').addEventListener('click', e => {
    const price = e.target.closest('[data-price]');
    const opt = e.target.closest('[data-profile]');
    if (!opt && !price) return;
    if (price) GS.setPriceMode(price.dataset.price);
    else {
      GS.setProfile(opt.dataset.profile);
      try { localStorage.setItem(PROFILE_KEY, opt.dataset.profile); } catch (err) {}
    }
    renderProfilePanel();
    document.getElementById('profilePanel').hidden = true;
    // Re-pick every by-name list item: the best product under a new profile
    // is a different product, which is the whole point of switching.
    let repicked = 0;
    MY_LIST.forEach(en => {
      if (!en.q || en.pinned) return;          // never override a manual swap
      const best = GS.bestFor(en.q, FILTERS, 1);
      if (best.length && best[0].sku !== en.sku) { en.sku = best[0].sku; repicked++; }
    });
    if (repicked) GS.saveMyList(MY_LIST);
    renderResults(document.getElementById('q').value);
    renderListBar();
    if (!document.getElementById('listSheet').hidden) renderListSheet();
  });

  navWatch('listSheet', 'sheet');
  navWatch('detailOverlay', 'detail');
  document.getElementById('backBtn').addEventListener('click', () => history.back());

  loadFilters();
  renderFilterPanel();
  updateFilterSummary(null, null);

  document.getElementById('filterToggle').addEventListener('click', () => {
    const panel = document.getElementById('filterPanel');
    panel.hidden = !panel.hidden;
  });
  document.getElementById('filterPanel').addEventListener('change', e => {
    const cb = e.target.closest('input[type=checkbox]');
    if (!cb) return;
    const list = cb.dataset.kind === 'diet' ? FILTERS.requireTags : FILTERS.avoidFlags;
    const i = list.indexOf(cb.dataset.value);
    if (cb.checked) { if (i < 0) list.push(cb.dataset.value); }
    else if (i >= 0) list.splice(i, 1);
    saveFilters();
    renderFilterPanel();
    renderResults(document.getElementById('q').value);
  });
  document.getElementById('filterPanel').addEventListener('click', e => {
    const sev = e.target.closest('[data-sev]');
    if (sev) {
      GS.setFlagPref(sev.dataset.label, +sev.dataset.sev);
      renderFilterPanel();
      renderResults(document.getElementById('q').value);
      renderListBar();
      if (!document.getElementById('listSheet').hidden) renderListSheet();
      return;
    }
    if (e.target.closest('#flagReset')) {
      GS.resetFlagPrefs();
      renderFilterPanel();
      renderResults(document.getElementById('q').value);
      renderListBar();
      if (!document.getElementById('listSheet').hidden) renderListSheet();
      return;
    }
    if (!e.target.closest('#filterClear')) return;
    FILTERS = { requireTags: [], avoidFlags: [] };
    saveFilters();
    renderFilterPanel();
    renderResults(document.getElementById('q').value);
  });

  // ---- shopping list sheet ----
  const sheet = document.getElementById('listSheet');
  document.getElementById('listTab').addEventListener('click', () => openList());
  document.getElementById('listOpenBtn').addEventListener('click', () => openList());

  sheet.addEventListener('click', e => {
    if (e.target.closest('.sheet-backdrop') || e.target.closest('.sheet-close')) {
      sheet.hidden = true; SWAP_OPEN = null; CLEAR_ARMED = false; LIST_PICK = null; return;
    }
    if (e.target.closest('[data-pick-back]')) { LIST_PICK = null; renderListSheet(); return; }
    if (e.target.closest('[data-pick-more]')) { LIST_PICK.n += 30; renderListSheet(); return; }
    if (e.target.closest('[data-pick-text]')) {
      MY_LIST.push({ q: LIST_PICK.q, sku: null, checked: false });
      LIST_PICK = null; GS.saveMyList(MY_LIST); renderListBar(); renderListSheet(); return;
    }
    const pick = e.target.closest('[data-pick]');
    if (pick) {
      const sku = pick.dataset.pick, { q, replace } = LIST_PICK;
      if (replace != null && MY_LIST[replace]) { MY_LIST[replace].sku = sku; MY_LIST[replace].pinned = true; }
      else MY_LIST.push({ q, sku, checked: false, pinned: true });     // your choice: never re-picked
      LIST_PICK = null;
      GS.saveMyList(MY_LIST); renderListBar(); renderListSheet();
      const p = GS.product(sku); toast(`${replace != null ? 'Swapped to' : 'Added'} ${p ? p.name.slice(0, 40) : 'item'}`);
      return;
    }
    const mkAdd = e.target.closest('[data-make-add]');
    if (mkAdd) { addMakeIngredients(mkAdd.dataset.makeAdd); return; }
    const mealAdd = e.target.closest('[data-meal-add]');
    if (mealAdd) { addMeal(mealAdd.dataset.mealAdd); return; }
    if (e.target.closest('[data-clear]')) { clearList(); return; }
    const exp = e.target.closest('[data-export]');
    if (exp) { exportList(exp.dataset.export); return; }
    const add = e.target.closest('#addItemBtn');
    if (add) {
      const box = document.getElementById('addItemInput');
      if (LIST_PICK && box.value.trim()) { LIST_PICK.q = box.value.trim(); LIST_PICK.n = 30; renderListSheet(); }
      else addItemByName(box.value);
      return;
    }
    const check = e.target.closest('[data-check]');
    if (check) {
      const i = +check.dataset.check;
      MY_LIST[i].checked = !MY_LIST[i].checked;
      GS.saveMyList(MY_LIST); renderListSheet(); return;
    }
    const rm = e.target.closest('[data-remove]');
    if (rm) {
      MY_LIST.splice(+rm.dataset.remove, 1);
      SWAP_OPEN = null;
      GS.saveMyList(MY_LIST); renderListBar(); renderListSheet(); return;
    }
    const sw = e.target.closest('[data-swapbtn]');
    if (sw) {
      const i = +sw.dataset.swapbtn;
      LIST_PICK = { q: MY_LIST[i].q, n: 30, replace: i };
      renderListSheet();
      const body = document.querySelector('#listSheet .sheet-body'); if (body) body.scrollTop = 0;
      return;
    }
    const opt = e.target.closest('[data-swap]');
    if (opt) {
      const en = MY_LIST[+opt.dataset.swap];
      en.sku = opt.dataset.sku;
      // You picked this deliberately, so stop re-picking it. Without the pin,
      // switching diet profiles silently threw away a manual choice, which is
      // exactly the kind of thing that makes a tool feel untrustworthy.
      en.pinned = true;
      SWAP_OPEN = null;
      GS.saveMyList(MY_LIST); renderListBar(); renderListSheet(); return;
    }
  });

  sheet.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const box = e.target.closest('#addItemInput');
    if (!box) return;
    e.preventDefault();
    if (LIST_PICK && box.value.trim()) { LIST_PICK.q = box.value.trim(); LIST_PICK.n = 30; renderListSheet(); }
    else addItemByName(box.value);
    box.blur();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !sheet.hidden) { sheet.hidden = true; SWAP_OPEN = null; LIST_PICK = null; }
  });

  // Results appear when you press Enter, not on every letter: the page reshuffling under
  // each keystroke looked jumpy. Emptying the box still returns to the home screen at once.
  document.getElementById('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); renderResults(e.target.value); e.target.blur(); }
  });
  document.getElementById('q').addEventListener('input', e => {
    if (!e.target.value.trim()) renderResults('');
  });
  document.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) setTab(tab.dataset.tab);
  });
  document.getElementById('dinnerTab').addEventListener('click', dinnerClick);
  document.querySelector('.search-pill').addEventListener('click', () => document.getElementById('q').focus());
  const importTab = document.getElementById('importTab');
  importTab.addEventListener('click', importClick);
  importTab.addEventListener('change', importChange);
  const planTab = document.getElementById('planTab');
  planTab.addEventListener('click', planClick);
  planTab.addEventListener('input', e => {
    const inp = e.target.closest('.pl-input'); if (!inp) return;
    document.getElementById('plMsg_' + inp.dataset.slot).textContent = '';
    refreshSugg(inp.dataset.slot, inp.value);
  });
  planTab.addEventListener('keydown', e => {
    const inp = e.target.closest('.pl-input');
    if (inp && e.key === 'Enter') { e.preventDefault(); planCommit(inp.dataset.slot); }
  });
  document.getElementById('results').addEventListener('click', e => {
    if (e.target.closest('#mealsShuffle')) {
      dealMeals();
      renderResults(document.getElementById('q').value, false);
      const head = document.querySelector('.meals-head'); if (head) head.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (e.target.closest('#mealsMore')) {
      SHOW_ALL_MEALS = true;
      renderResults(document.getElementById('q').value, false);
      return;
    }
    const meal = e.target.closest('[data-meal]');
    if (meal) { renderMeal(meal.dataset.meal); return; }
    const mk = e.target.closest('[data-make]');
    if (mk) { renderCompare(mk.dataset.make); return; }
    if (e.target.closest('#showMoreBtn')) {
      VISIBLE_COUNT += PAGE_SIZE;
      renderResults(document.getElementById('q').value, false);
      return;
    }
    const addBtn = e.target.closest('.add-fab');
    if (addBtn) {
      const sku = addBtn.dataset.sku;
      if (!onList(sku)) MY_LIST.push({ q: null, sku, checked: false });
      GS.saveMyList(MY_LIST);
      renderResults(document.getElementById('q').value, false);
      renderListBar();
      return;
    }
    const card = e.target.closest('.card');
    if (card) renderBreakdown(card.dataset.sku);
  });
  const scanFile = document.getElementById('scanFile');
  document.getElementById('scanBtn').addEventListener('click', () => scanFile.click());
  scanFile.addEventListener('change', () => { const f = scanFile.files && scanFile.files[0]; scanFile.value = ''; if (f) scanLabel(f); });
  importStatus().then(() => { document.getElementById('scanBtn').hidden = !IMPORT_AI; });
  document.getElementById('detailOverlay').addEventListener('click', e => {
    if (e.target.closest('[data-scan-again]')) { scanFile.click(); return; }
    const mk = e.target.closest('.detail-ings mark[title]');
    if (mk) { toast(mk.title); return; }          // phones have no hover tooltip
    if (e.target.closest('.detail-close') || e.target.classList.contains('detail-backdrop')) closeBreakdown();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBreakdown(); });
})();
</script>
</body>
</html>
