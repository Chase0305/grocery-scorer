<!-- Version query is a one-time cache bust: entries cached BEFORE
     scripts/serve.py started sending no-store keep their heuristic
     freshness and are never revalidated. Bump it if a JS change ever
     appears not to take effect. -->
<script src="proto_shared.js?v=34"></script>
<script>
let MY_LIST = [];

function cardImg(p) {
  return p.image_url
    ? `<img src="${p.image_url}" loading="lazy" onerror="this.parentElement.innerHTML=''">`
    : '';
}
const WARN_ICON = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.2 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>`;

/* Show only the MOST serious level on the card - a stack of chips on a small
   card is noise, and the detail panel lists every one with its citation. */
function warnChip(sku) {
  const d = GS.scoredDetail(sku);
  const w = d && d.carcinogens && d.carcinogens.length ? d.carcinogens[0] : null;
  if (!w) return '';
  const labels = { known: 'Carcinogen', probable: 'Probable', possible: 'Possible' };
  const all = d.carcinogens.map(x => `${x.label} (${x.classification})`).join(' · ');
  return `<span class="warn-chip warn-${w.level}" title="${all}">${WARN_ICON}${labels[w.level] || 'Warning'}</span>`;
}

/* One chip on the card (the most significant); the full set with numbers
   lives in the detail panel. */
function nutChip(sku) {
  const d = GS.scoredDetail(sku);
  if (!d) return '';
  // Ingredient banners come first - "Seed oil" is a stronger statement about
  // the product than "high in sodium", and only one chip fits on a card.
  const ing = d.ingredient_banners || [];
  if (ing.length) {
    const all = ing.map(x => `${x.label} - ${x.detail}`).join(' · ');
    return `<span class="nut-chip ing-chip" title="${all}">${ing[0].label}</span>`;
  }
  const f = (d.nutrition_flags || [])[0];
  if (f) {
    const all = d.nutrition_flags.map(x => `${x.label} - ${x.detail}`).join(' · ');
    return `<span class="nut-chip" title="${all}">${f.label}</span>`;
  }
  // Weakest signal of the three, so it only claims the card's single chip
  // slot when there is nothing more concrete to say. Absent entirely when
  // scripts/price_signal.py is disabled or was never run.
  const pf = (d.price_flags || [])[0];
  if (!pf) return '';
  return `<span class="nut-chip price-chip" title="${pf.detail} — ${pf.basis}">${pf.label}</span>`;
}

/* Price on the card, with a per-unit figure when the size is parseable -
   that is the number you actually compare across brands. */
function priceBit(sku) {
  const price = GS.priceFor(sku);
  if (!price) return '';
  const u = GS.unitPrice(sku);
  return `<span class="card-price">${price}</span>` +
         (u ? `<span class="card-unit">$${u.perOz.toFixed(2)}/${u.unit}</span>` : '');
}

function gradeChip(sku) {
  const s = GS.scoreFor(sku);
  if (s == null) return `<div class="grade-chip none">—</div>`;
  return `<div class="grade-chip" style="background:${GS.scoreColor(s)}">${Math.round(s)}</div>`;
}

/* ------------------------------------------------------------------ filters
   Allergen/diet filters SHOW ONLY products ShopRite itself tags, because
   inferring an allergen from an ingredient list is not safe enough to hand
   someone who is filtering for a medical reason. Ingredient-preference
   filters HIDE confirmed matches and leave unknowns visible, because the
   cost of being wrong is only annoyance. See proto_shared.js. */
const DIET_FILTERS = [
  ['Gluten Free', 'gluten free'], ['Dairy Free', 'dairy free'], ['Lactose Free', 'lactose free'],
  ['Peanut Free', 'peanut free'], ['Soy Free', 'soy free'], ['Egg Free', 'egg free'],
  ['Vegan', 'vegan'], ['Keto Friendly', 'keto friendly'], ['Paleo', 'paleo'],
  ['Organic', 'organic'], ['Non GMO', 'non gmo'], ['Kosher', 'kosher'], ['Halal', 'halal'],
];
// Labels must match scorer.py's flagged_ingredients.json exactly.
const AVOID_FILTERS = [
  ['Seed & added oils', 'added oil'], ['Palm oil', 'palm oil'],
  ['Hydrogenated oil', 'hydrogenated oil'], ['Added sugar', 'added sugar'],
  ['Added color', 'added color'], ['Preservatives', 'preservative'],
  ['Added flavoring', 'added flavoring'], ['Emulsifiers', 'emulsifier'],
  ['Thickeners/stabilizers', 'thickener/stabilizer'], ['Isolated protein', 'isolated protein'],
  ['Dough conditioner', 'dough conditioner'], ['Hydrolyzed protein', 'hydrolyzed protein'],
  ['Mech. separated meat', 'mechanically separated meat'],
  ['Artificial sweeteners', 'artificial sweetener'], ['Phosphoric acid', 'phosphoric acid'],
];
/* ---------------------------------------------------------------- profiles
   A profile re-weights the sub-scores; it never changes the underlying facts
   about a product, and it cannot beat a score cap. Switching one re-renders
   results and re-picks every by-name item on the shopping list, because the
   best peanut butter for "low sodium" is a different jar. */
const PROFILE_KEY = 'groceryscorer_profile_v1';

function renderProfilePanel() {
  const all = GS.profiles();
  const cur = GS.currentProfile();
  document.getElementById('profileBtn').textContent = (all[cur] || {}).label || 'Ingredients first';
  document.getElementById('profileBtn').classList.toggle('on', cur !== 'default');
  const pm = GS.priceMode();
  const PRICE_LABEL = { off: 'Best score', balanced: 'Balanced', cheaper: 'Cheaper' };
  document.getElementById('profileBtn').textContent += pm === 'off' ? '' : ' · ' + PRICE_LABEL[pm].toLowerCase();
  document.getElementById('profileBtn').classList.toggle('on', cur !== 'default' || pm !== 'off');
  document.getElementById('profilePanel').innerHTML =
    `<div class="price-head"><b>Price.</b> Scores never change. Among products that are already
      good (within 10 points of the best for Balanced, 20 for Cheaper), the cheapest per ounce comes first.</div>
     <div class="price-row">${['off', 'balanced', 'cheaper'].map(m =>
       `<button class="price-opt ${m === pm ? 'on' : ''}" data-price="${m}">${PRICE_LABEL[m]}</button>`).join('')}</div>` +
    Object.values(all).map(p => `
      <button class="profile-opt ${p.name === cur ? 'on' : ''}" data-profile="${p.name}">
        <b>${p.label}</b><span>${p.blurb}</span>
        ${p.coverage_note ? `<em>${p.coverage_note}</em>` : ''}
      </button>`).join('') +
    `<div class="profile-note">Only the weighting changes — the ingredient and nutrition
     facts are the same. Caps still apply under every profile: no preference lifts
     cured meat above 50, a bottle of seed oil above 25, or pure sugar above 40.
     <br>Keto and high-protein are deliberately missing: carbohydrate data covers
     36% of the catalog and protein 41%, so those profiles would rank mostly on
     data we don't have.</div>`;
}

const FILTER_KEY = 'groceryscorer_filters_v1';
let FILTERS = { requireTags: [], avoidFlags: [] };

function loadFilters() {
  try {
    const raw = localStorage.getItem(FILTER_KEY);
    if (raw) { const f = JSON.parse(raw);
      FILTERS = { requireTags: f.requireTags || [], avoidFlags: f.avoidFlags || [] }; }
  } catch (e) {}
}
function saveFilters() {
  try { localStorage.setItem(FILTER_KEY, JSON.stringify(FILTERS)); } catch (e) {}
}
function activeFilterCount() { return FILTERS.requireTags.length + FILTERS.avoidFlags.length; }

function renderFilterPanel() {
  const opt = (label, value, list, cls) => {
    const on = list.includes(value);
    return `<label class="filter-opt ${on ? 'on ' + cls : ''}">
      <input type="checkbox" data-kind="${cls}" data-value="${value}" ${on ? 'checked' : ''}>
      ${label}</label>`;
  };
  const anyDiet = FILTERS.requireTags.length > 0;
  document.getElementById('filterPanel').innerHTML = `
    <div class="filter-group">
      <h4>Only show products labelled</h4>
      <p>Uses ShopRite's own product labelling, not a guess from the ingredient list.</p>
      <div class="filter-opts">${DIET_FILTERS.map(([l, v]) => opt(l, v, FILTERS.requireTags, 'diet')).join('')}</div>
      ${anyDiet ? `<div class="filter-note"><b>Products without this label are hidden, not judged.</b>
        ShopRite labels most but not all of its catalog, so some safe products are hidden too —
        and a missing label is not proof a product contains the allergen. If you are avoiding
        something for a medical reason, always check the package itself.</div>` : ''}
    </div>
    <div class="filter-group">
      <h4>Hide products containing</h4>
      <p>Based on the ingredient list. Products with no ingredient list stay visible, since we can't confirm either way.</p>
      <div class="filter-opts">${AVOID_FILTERS.map(([l, v]) => opt(l, v, FILTERS.avoidFlags, 'avoid')).join('')}</div>
    </div>
    <div class="filter-group">
      <h4>How harshly each ingredient counts</h4>
      <p>These severities are my opinion, not a fact. Turn one off or change how much
         it bites — scores update everywhere, including what the shopping list picks.</p>
      ${Object.keys(GS.flagDefs()).sort().map(label => {
        const sev = GS.severityOf(label);
        const def = GS.flagDefs()[label];
        const btn = (v, txt) => `<button class="sev-btn ${sev === v ? 'on' : ''} ${v === 0 ? 'off' : ''}"
            data-sev="${v}" data-label="${label}">${txt}</button>`;
        return `<div class="sev-row">
          <div class="sev-name">${label}<small>${sev === def ? 'default' : `changed from ${def}`}</small></div>
          <div class="sev-btns">${btn(0,'off')}${btn(1,'mild')}${btn(2,'strong')}${btn(3,'severe')}</div>
        </div>`;
      }).join('')}
      <div class="profile-note">"severe" also caps the product at 50 however well it
        scores otherwise. Caps that come from what a thing <em>is</em> — cured meat,
        a bottle of seed oil, pure sugar — are not editable here.</div>
      ${GS.flagsCustomised() ? `<div style="margin-top:10px"><button class="filter-clear" id="flagReset">Reset ingredient severities to default</button></div>` : ''}
    </div>
    <div class="filter-group"><button class="filter-clear" id="filterClear">Clear all filters</button></div>`;
}

function updateFilterSummary(hidden, unknown) {
  const n = activeFilterCount();
  document.getElementById('filterToggle').classList.toggle('on', n > 0);
  document.getElementById('filterToggle').textContent = n ? `Filters (${n})` : 'Filters';
  const el = document.getElementById('filterSummary');
  if (!n || hidden == null) { el.textContent = ''; return; }
  el.textContent = hidden
    ? `${hidden} hidden by filters${unknown ? ` — ${unknown} of them simply have no label` : ''}`
    : 'nothing hidden by filters';
}

let CURRENT_RESULTS = [];
let VISIBLE_COUNT = 30;
const PAGE_SIZE = 30;

function renderResults(q, resetPaging) {
  const box = document.getElementById('results');
  // The photo hero is for arriving; once there are results it shrinks to a search bar.
  document.body.classList.toggle('searched', !!q.trim());
  if (!q.trim()) { box.innerHTML = renderMeals(); CURRENT_RESULTS = []; return; }

  if (resetPaging !== false) {
    const raw = GS.search(q);
    const { kept, hidden, unknown } = GS.applyFilters(raw, FILTERS);
    CURRENT_RESULTS = kept;
    updateFilterSummary(hidden, unknown);
    VISIBLE_COUNT = PAGE_SIZE;
  }
  if (!CURRENT_RESULTS.length) {
    box.innerHTML = activeFilterCount()
      ? `<div class="empty-state">Nothing matches "${esc(q)}" with these filters on.<br>Try clearing a filter — products ShopRite hasn't labelled are hidden by the "only show" filters.</div>`
      // The crawl covers the 14 FOOD departments only, so household, pet,
      // beauty and pharmacy genuinely are not here. Saying so beats letting
      // someone conclude the search is broken.
      : `<div class="empty-state">Nothing found for "${esc(q)}".<br>
           This covers food only — the 14 grocery departments, not household,
           pet, beauty or pharmacy.<br>Try a simpler word, or a brand name.</div>`;
    return;
  }

  const dropped = GS.relaxedWord();
  const relaxedNote = dropped
    ? `<div class="relaxed">Nothing matched all of that, so we dropped <b>"${dropped}"</b> and searched for the rest.</div>`
    : '';

  const shown = CURRENT_RESULTS.slice(0, VISIBLE_COUNT);
  const remaining = CURRENT_RESULTS.length - shown.length;
  const pmode = GS.priceMode();
  const priceNote = pmode === 'off' ? ''
    : `<div class="relaxed">Price mode <b>${pmode}</b>: of the good picks, cheapest per ounce first. <a href="#" data-price-off>Back to best score</a></div>`;
  box.innerHTML = priceNote + relaxedNote + shown.map(p => `
    <div class="card" data-sku="${p.sku}">
      <div class="card-img">${cardImg(p)}</div>
      <div class="card-brand">${p.brand || '—'}</div>
      <div class="card-name">${p.name}</div>
      <div class="card-foot">
        <div class="card-foot-left">${gradeChip(p.sku)}${priceBit(p.sku)}${warnChip(p.sku)}${nutChip(p.sku)}</div>
        <button class="add-fab ${onList(p.sku) ? 'added' : ''}" data-sku="${p.sku}">
          ${onList(p.sku)
            ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>`
            : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>`}
        </button>
      </div>
    </div>`).join('')
    + (remaining > 0
        ? `<button class="show-more" id="showMoreBtn">Show ${Math.min(remaining, PAGE_SIZE)} more (${remaining} left of ${CURRENT_RESULTS.length})</button>`
        : (CURRENT_RESULTS.length > PAGE_SIZE ? `<div class="results-end">That's all ${CURRENT_RESULTS.length} matches.</div>` : ''));
}

/* -------------------------------------------------------- score breakdown
   Click any card (not the + button) to see why it scored what it did - the
   explanation strings already live on each applicable sub_score, computed
   by scorer.py. Only available for the ~1,750 hand-curated products; a
   full-catalog-only hit shows a plain "not yet scored" message instead of
   guessing. Aisle is shown the same way - "if applicable", since the full
   crawl deliberately doesn't carry it. */
/* The full ingredient list, behind a tap, with every flagged term highlighted so you can
   see exactly which words cost the product points. Terms come from the same
   flagged_ingredients.json the scorer uses, fetched once. The list is escaped first and
   only then marked up - it is third-party text. */
let FLAG_TERMS = null;
async function flagTerms() {
  if (FLAG_TERMS) return FLAG_TERMS;
  try {
    const defs = await (await fetch('/scripts/flagged_ingredients.json')).json();
    FLAG_TERMS = Object.values(defs).flatMap(d => (d.terms || []).map(t => ({ t: t.toLowerCase(), label: d.label })))
      .sort((a, b) => b.t.length - a.t.length);       // longest first: "high fructose corn syrup" before "corn syrup"
  } catch (e) { FLAG_TERMS = []; }
  return FLAG_TERMS;
}
function ingredientsHtml(text, terms) {
  if (!terms.length) return esc(text);
  // ONE pass over the text with every term in one pattern, longest first, so a shorter
  // term can never match inside a phrase (or a tooltip) that is already highlighted.
  // Look-alikes the scorer ignores ("sugar snap peas", "honeydew") are in the pattern
  // too, and left unmarked.
  const label = new Map(terms.map(x => [x.t, x.label]));
  const alt = ['sugar snap', 'honeydew', ...terms.map(x => x.t)]
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  const re = new RegExp(`(^|[^a-z])((?:${alt})(?:e?s)?)(?![a-z])`, 'gi');     // plurals too: "natural flavors"
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    const start = m.index + m[1].length, word = m[2], w = word.toLowerCase();
    const lab = label.get(w) || label.get(w.replace(/s$/, '')) || label.get(w.replace(/es$/, ''));
    out += esc(text.slice(last, start)) + (lab ? `<mark title="Flagged: ${esc(lab)}">${esc(word)}</mark>` : esc(word));
    last = start + word.length;
    re.lastIndex = last;
  }
  return out + esc(text.slice(last));
}

/* --------------------------------------------------------------- label scanner
   Photograph an ingredient label - any product, including ones the catalog doesn't
   have - and get it scored on the spot. The AI only READS the label; the score comes
   from scorer.py on the server, by the same rules as every catalog product
   (scripts/label_ai.py). The photo is shrunk here first (a phone photo is 3-12 MB;
   1600 px is plenty to read print and keeps the upload small). */
function shrinkPhoto(file, maxSide = 1600) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}
function scanOverlay(inner) {
  const overlay = document.getElementById('detailOverlay');
  overlay.innerHTML = `<div class="detail-backdrop"></div><div class="detail-panel">
    <button class="detail-close" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    ${inner}</div>`;
  overlay.hidden = false;
}
async function scanLabel(file) {
  scanOverlay(`<div class="scan-wait"><div class="scan-spin"></div><b>Reading the label…</b><span>Usually 3-8 seconds.</span></div>`);
  let r;
  try {
    const image = await shrinkPhoto(file);
    r = await (await fetch('/api/label', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image, media_type: 'image/jpeg' }) })).json();
  } catch (e) { r = { ok: false, error: "Couldn't send the photo - is the app's server running?" }; }
  if (!r.ok) {
    scanOverlay(`<div class="scan-wait"><b>Couldn't score that photo</b><span>${esc(r.error || 'Try again.')}</span>
      <button class="big-btn" data-scan-again>Try another photo</button>
      <span class="scan-tip">Tip: fill the frame with the ingredient list, hold the phone flat, and include the Nutrition Facts panel if it fits.</span></div>`);
    return;
  }
  const rd = r.reading, sc = r.score, total = sc.total_score;
  const terms = rd.ingredients ? await flagTerms() : [];
  const subs = Object.entries(sc.sub_scores || {}).filter(([, v]) => v && v.applicable && v.explanation);
  const NUT = { 'calories': ['Calories', ''], 'added Sugars': ['Added sugar', 'g'], 'total Sugars': ['Total sugar', 'g'],
    'sodium': ['Sodium', 'mg'], 'saturated Fat': ['Saturated fat', 'g'], 'protein': ['Protein', 'g'], 'dietary Fiber': ['Fiber', 'g'] };
  const nut = Object.entries(rd.nutrition || {}).map(([k, v]) => NUT[k] ? `<span><b>${v}${NUT[k][1]}</b> ${NUT[k][0].toLowerCase()}</span>` : '').join('');
  scanOverlay(`
    <div class="detail-head">
      <div class="detail-thumb scan-thumb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
      <div class="detail-meta"><div class="detail-brand">Scanned label</div>
        <div class="detail-name">${esc(rd.product_name || 'Scanned label')}</div>
        ${rd.serving_size ? `<div class="detail-price">Per serving: ${esc(rd.serving_size)}</div>` : ''}</div>
      ${total != null ? `<div class="detail-score" style="background:${GS.scoreColor(total)}">${Math.round(total)}</div>` : ''}
    </div>
    ${total != null ? `<div class="detail-scale"><div class="detail-scale-bar"><span class="detail-scale-pin" style="left:${Math.max(0, Math.min(100, total))}%">${GS.grade(total)}</span></div>
      <div class="detail-scale-ends"><span>0 · avoid</span><span>100 · best</span></div></div>` : '<div class="detail-gap">Not enough was readable to score this. Try a closer photo.</div>'}
    <div class="scan-note">Read from your photo by AI and scored by the same rules as every product here. Check the list below matches the label.${rd.ingredients_complete ? '' : ' <b>Part of the list was unreadable</b>, so the score may be off.'}${rd.problem ? ' ' + esc(rd.problem) : ''}</div>
    ${(sc.nutrition_flags || []).length ? `<div class="detail-nutflags">${sc.nutrition_flags.map(f => `<div class="detail-nutflag"><b>${esc(f.label)}</b><span>${esc(f.detail)}</span></div>`).join('')}</div>` : ''}
    ${rd.ingredients ? `<details class="detail-ings" open><summary><span>Ingredients</span></summary>
      <div class="detail-ings-body">${ingredientsHtml(rd.ingredients, terms)}</div></details>` : ''}
    ${nut ? `<div class="scan-nut">${nut}</div>` : ''}
    ${subs.length ? `<div class="detail-rows">${subs.map(([key, v]) => `
      <div class="detail-row"><div class="detail-row-top"><div class="detail-row-label">${GS.pretty(key)}</div>
        ${typeof v.score === 'number' ? `<div class="detail-row-num">${Math.round(v.score)}</div>` : ''}</div>
        ${typeof v.score === 'number' ? `<div class="detail-row-bar"><i style="width:${Math.max(3, Math.min(100, v.score))}%;background:${GS.scoreColor(v.score)}"></i></div>` : ''}
        <div class="detail-row-exp">${esc(v.explanation)}</div></div>`).join('')}</div>` : ''}
    <div class="scan-note" style="margin-top:12px">A scanned product has no aisle category or outside processing grade, so only its ingredients and nutrition are scored.</div>
    <button class="big-btn" data-scan-again style="margin-top:12px">Scan another label</button>`);
}

async function renderBreakdown(sku) {
  // Explanations are not in the page-load data; the first tap fetches them once.
  if (!GS.detailReady()) await GS.ensureDetail();
  const p = GS.product(sku) || GS.scoredDetail(sku);
  if (!p) return;
  const detail = GS.scoredDetail(sku);
  const overlay = document.getElementById('detailOverlay');
  const ingText = String((GS.product(sku) || {}).ingredients || '').trim();
  const ingCount = ((detail && detail.sub_scores && detail.sub_scores.ingredient_simplicity) || {}).top_level_count || 0;
  const terms = ingText ? await flagTerms() : [];
  const aisle = detail ? GS.aisleLabel(detail.aisle) : null;

  let bodyHtml;
  if (!detail) {
    bodyHtml = `<div class="detail-empty">Not yet scored — this product hasn't been through the ingredient scorer yet.</div>`;
  } else {
    const warns = detail.carcinogens || [];
    const warnHtml = warns.length ? `<div class="detail-warnings">${warns.map(w => `
        <div class="detail-warn warn-${w.level}">
          <div class="detail-warn-top">${WARN_ICON}<span>${w.label}</span>
            <span class="detail-warn-class">${w.classification}</span></div>
          <div class="detail-warn-note">${w.note || ''}</div>
          <div class="detail-warn-src">Source: ${w.source}</div>
        </div>`).join('')}</div>` : '';

    const nf = [...(detail.ingredient_banners || []), ...(detail.nutrition_flags || []),
                ...(detail.price_flags || [])];
    const nutHtml = nf.length ? `<div class="detail-nutflags">${nf.map(f => `
        <div class="detail-nutflag ${f.id === 'seed_oil' || f.id === 'contains_seed_oil' ? 'detail-ingflag' : (f.id === 'cheap_for_claim' ? 'detail-priceflag' : '')}" title="${f.basis}">
          <b>${f.label}</b><span>${f.detail}</span>
        </div>`).join('')}</div>` : '';

    const subs = Object.entries(detail.sub_scores || {}).filter(([, v]) => v && v.applicable && v.explanation);
    // Without a nutrition panel the sugar DOSE (and its cap) is invisible: a full-sugar soda
    // can then score like a lightly sweetened one. Say so rather than look certain.
    const nutOk = ((detail.sub_scores || {}).nutrition || {}).applicable;
    const sugary = (((detail.sub_scores || {}).flagged_ingredients || {}).matched || []).includes('added sugar');
    const gapHtml = (!nutOk && sugary) ? `<div class="detail-gap"><b>Sugar amount unknown.</b> This product has added sugar
      but no nutrition panel in our data yet, so how MUCH sugar isn't counted - the score may be too high.</div>` : '';
    bodyHtml = gapHtml + warnHtml + nutHtml + (subs.length ? `<div class="detail-rows">${subs.map(([key, v]) => `
        <div class="detail-row">
          <div class="detail-row-top"><div class="detail-row-label">${GS.pretty(key)}</div>
            ${typeof v.score === 'number' ? `<div class="detail-row-num">${Math.round(v.score)}</div>` : ''}</div>
          ${typeof v.score === 'number' ? `<div class="detail-row-bar"><i style="width:${Math.max(3, Math.min(100, v.score))}%;background:${GS.scoreColor(v.score)}"></i></div>` : ''}
          <div class="detail-row-exp">${v.explanation}</div>
        </div>`).join('')}</div>`
      : `<div class="detail-empty">No breakdown available for this product.</div>`);
  }

  overlay.innerHTML = `
    <div class="detail-backdrop"></div>
    <div class="detail-panel">
      <button class="detail-close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="detail-head">
        ${p.image_url ? `<img class="detail-thumb" src="${p.image_url}">` : `<div class="detail-thumb"></div>`}
        <div class="detail-meta">
          <div class="detail-brand">${p.brand || ''}</div>
          <div class="detail-name">${p.name}</div>
          ${aisle ? `<div class="detail-aisle">${aisle}</div>` : ''}
          ${(() => {
            const price = GS.priceFor(sku); if (!price) return '';
            const u = GS.unitPrice(sku);
            return `<div class="detail-price"><b>${price}</b>${u ? ` · $${u.perOz.toFixed(2)} per ${u.unit}` : ''}</div>`;
          })()}
        </div>
        ${detail ? `<div class="detail-score" style="background:${GS.scoreColor(GS.scoreFor(sku))}">${Math.round(GS.scoreFor(sku))}</div>` : ''}
      </div>
      ${detail && GS.scoreFor(sku) != null ? `<div class="detail-scale" aria-label="Score ${Math.round(GS.scoreFor(sku))} out of 100">
        <div class="detail-scale-bar"><span class="detail-scale-pin" style="left:${Math.max(0, Math.min(100, GS.scoreFor(sku)))}%">${GS.grade(GS.scoreFor(sku))}</span></div>
        <div class="detail-scale-ends"><span>0 · avoid</span><span>100 · best</span></div>
      </div>` : ''}
      ${ingText ? `<details class="detail-ings">
        <summary><span>Ingredients</span><span class="detail-ings-n">${ingCount ? ingCount + ' · ' : ''}tap to see</span></summary>
        <div class="detail-ings-body">${ingredientsHtml(ingText, terms)}</div>
        ${/<mark/.test(ingredientsHtml(ingText, terms)) ? '<div class="detail-ings-key"><mark>Highlighted</mark> = flagged by the scorer. Tap a highlight to see why.</div>' : ''}
      </details>` : (detail ? '<div class="detail-ings detail-ings-none">No ingredient list for this one' + (GS.aisleGroup(sku) === 'Produce' ? ' — it is the food itself.' : '.') + '</div>' : '')}
      ${bodyHtml}
    </div>`;
  overlay.hidden = false;
}
function closeBreakdown() { document.getElementById('detailOverlay').hidden = true; }

/* ------------------------------------------------------------- meal cards
   A meal is a title and a list of ingredient NAMES. Everything else is the
   shopping list's existing machinery: each name resolves to the best-scoring
   product that passes your filters and diet profile, so a card automatically
   respects both. Its score is the average of what it would actually put on
   your list, which means the card re-scores itself when you change profile.

   The picture is a collage of the real product photos rather than stock
   food photography - it is honest about what you would be buying, and it
   updates with the picks. */
let MEALS = [];

function mealPicks(meal) {
  return meal.items.map(q => (GS.bestFor(q, FILTERS, 1)[0] || null));
}

function renderMeals() {
  if (!MEALS.length) {
    return `<div class="empty-state">Search to see real products with photos, straight from the shelf.</div>`;
  }
  // The buy-or-make shelf costs another ~30 searches. Let the meal cards paint
  // first and fill it in on the next tick (measured: it was ~half of the 1.5 s
  // first render on a cold load).
  setTimeout(() => {
    const slot = document.getElementById('makeSlot');
    if (slot) slot.outerHTML = renderMakeShelf();
  }, 0);
  return renderMealShelf() + '<div id="makeSlot"></div>';
}

/* One card, two homes: the Shop tab's shelf and the dinner flowchart's results.
   A meal with no photo yet gets its accent colour instead of a blank box. */
function mealCard(m) {
  const found = mealPicks(m).filter(Boolean);
  const scores = found.map(p => GS.scoreFor(p.sku)).filter(v => v != null);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  const bg = !m.image && m.accent ? ` style="background:linear-gradient(135deg, ${m.accent}, #2B2118)"` : '';
  return { avg, html: `<button class="meal" data-meal="${m.id}"${bg}>
    ${m.image ? `<img class="meal-photo" src="${m.image}" alt="" loading="lazy">` : ''}
    <div class="meal-scrim"></div>
    <div class="meal-body">
      <div class="meal-title">${m.title}</div>
      <div class="meal-sub">${m.subtitle}</div>
      <div class="meal-foot">
        ${avg != null ? `<span class="meal-score" style="background:${GS.scoreColor(avg)}">${avg}</span>` : ''}
        <span class="meal-n">${m.items.length} ingredients</span>
        <span class="meal-add">See ingredients</span>
      </div>
    </div>
  </button>` };
}

let SHOW_ALL_MEALS = false;
/* The shelf used to be the same 7 "featured" meals every visit. It now deals a fresh 6
   each time the page opens (and on "Show me different meals"): always two of the meals
   the user actually cooks (source: 'yours'), the rest from everything else with a photo,
   never repeating the previous deal when there are enough to avoid it. */
let MEAL_DEAL = null;
function dealMeals() {
  const pool = MEALS.filter(m => m.image);
  const prev = new Set(MEAL_DEAL || []);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fresh = list => { const f = list.filter(m => !prev.has(m.id)); return f.length >= 2 ? f : list; };
  const yours = shuffle(fresh(pool.filter(m => m.source === 'yours'))).slice(0, 2);
  const rest = shuffle(fresh(pool.filter(m => !yours.includes(m)))).slice(0, 6 - yours.length);
  MEAL_DEAL = shuffle([...yours, ...rest]).map(m => m.id);
}

function renderMealShelf() {
  // 27 cards would bury everything below the fold, so the shelf shows the
  // featured ones and offers the rest; the dinner tab covers the whole set.
  if (!MEAL_DEAL) dealMeals();
  const shown = SHOW_ALL_MEALS ? MEALS : MEAL_DEAL.map(id => MEALS.find(m => m.id === id)).filter(Boolean);
  return `<div class="meals">
    <div class="meals-head">Start with a meal</div>
    <div class="meals-sub">Each one fills your list with the best-scoring version of every
      ingredient — under your filters and whichever diet profile you're using.
      <button class="dq-link" data-tab="dinner">Can't decide? Help me pick dinner →</button></div>
    <div class="meal-grid">${shown.map(m => mealCard(m).html).join('')}</div>
    ${!SHOW_ALL_MEALS && shown.length < MEALS.length
      ? `<div class="meals-actions"><button class="meals-more" id="mealsShuffle">↻ Show me different meals</button>
         <button class="meals-more" id="mealsMore">See all ${MEALS.length} meals</button></div>` : ''}
  </div>`;
}

/* ------------------------------------------------------ what's for dinner
   A flowchart, not a quiz: four questions (craving, protein, spice, time - owner asked 2026-10-03 for mood and spice), each a few big buttons, each
   narrowing the same list of meals. A button shows how many meals it would
   leave and is disabled at zero, so you can never walk into a dead end.
   "Anything works" skips a question; tapping an answer chip undoes it. */
const DQ = [
  { key: 'mood', q: 'What are you craving?', opts: [
      ['cozy', 'Comfort food'], ['light', 'Fresh & light'], ['hearty', 'Big & hearty']] },
  { key: 'protein', q: 'Any protein in mind?', opts: [
      ['poultry', 'Chicken or turkey'], ['beef', 'Beef'], ['pork', 'Pork'],
      ['fish', 'Fish & seafood'], ['veg', 'Meat-free']] },
  { key: 'spice', q: 'How spicy?', opts: [
      ['mild', 'Keep it mild'], ['kick', 'A little kick'], ['hot', 'Bring the heat']] },
  { key: 'time', q: 'How much time do you have?', opts: [
      ['quick', '30 minutes or less'], ['medium', 'About an hour'], ['long', 'Plenty — an hour or more']] },
];
let DINNER = { answers: {}, step: 0, trail: [] };   // trail = questions the user actually answered

function dinnerMatches(answers) {
  return MEALS.filter(m => m.course === 'dinner' &&
    Object.entries(answers).every(([k, v]) => v == null || m[k] === v));
}

function renderDinner() {
  const box = document.getElementById('dinnerTab');
  if (!MEALS.length) { box.innerHTML = '<div class="empty-state">No meals loaded.</div>'; return; }
  // A question with only one possible answer left is not a question - skip it.
  // (beef + plenty of time leaves two meals that are both "cozy".)
  while (DINNER.step < DQ.length) {
    const k = DQ[DINNER.step].key;
    const live = DQ[DINNER.step].opts.filter(([v]) => dinnerMatches({ ...DINNER.answers, [k]: v }).length);
    if (live.length > 1) break;
    DINNER.step++;
  }
  const { answers, step } = DINNER;
  const left = dinnerMatches(answers);

  // Finished (answered everything, or narrowed to one meal) -> show the meals.
  if (step >= DQ.length || left.length <= 1) {
    const cards = left.map(m => ({ m, c: mealCard(m) }))
      .sort((a, b) => (b.c.avg ?? -1) - (a.c.avg ?? -1));
    const chips = DQ.filter(d => answers[d.key] != null).map(d => {
      const label = d.opts.find(o => o[0] === answers[d.key])[1];
      return `<button class="dq-chip" data-dq-undo="${d.key}">${label}</button>`;
    }).join('');
    box.innerHTML = `<div class="dq">
      <div class="dq-results-head">
        <h2>${left.length ? `${left.length} dinner${left.length === 1 ? '' : 's'} to choose from` : 'Nothing matches'}</h2>
        ${left.length > 1 ? '<button class="dq-surprise" id="dqSurprise">Surprise us</button>' : ''}
      </div>
      ${chips ? `<div class="dq-chips">${chips}</div>` : ''}
    </div>
    <div class="meal-grid">${cards.map(x => x.c.html).join('')}</div>
    <div class="dq"><div class="dq-foot"><button class="dq-link" id="dqReset">Start over</button></div></div>`;
    return;
  }

  const d = DQ[step];
  // Each answer is a photo tile showing a dinner it leads to, so the choice looks like food
  // rather than a form. No photo is used twice on one screen.
  const used = new Set();
  const PREFER = { veg: ['tofu', 'beanchili', 'lentil'] };   // a meat-free tile mustn't look like meat sauce
  const photoFor = (list, val) => {
    const m = (PREFER[val] || []).map(id => list.find(x => x.id === id && x.image)).find(Boolean)
      || list.find(x => x.image && !used.has(x.image)) || list.find(x => x.image);
    if (m) used.add(m.image);
    return m ? m.image : '';
  };
  const tiles = d.opts.map(([val, label]) => {
    const hits = dinnerMatches({ ...answers, [d.key]: val });
    return { val, label, n: hits.length, img: hits.length ? photoFor(hits, val) : '' };
  });
  const collage = left.filter(m => m.image && !used.has(m.image)).slice(0, 4).map(m => m.image);
  const bars = DQ.map((_, i) => `<i class="${i < step ? 'done' : i === step ? 'now' : ''}"></i>`).join('');
  box.innerHTML = `<div class="dq dq-ask">
    <div class="dq-top">
      <div class="dq-bars" aria-hidden="true">${bars}</div>
      <div class="dq-prog">Question ${step + 1} of ${DQ.length} · ${left.length} dinners left</div>
    </div>
    <h2>${d.q}</h2>
    <div class="dq-tiles">
      ${tiles.filter(t => t.n).map(t => `<button class="dq-tile" data-dq="${t.val}">
          ${t.img ? `<img src="${t.img}" alt="" loading="lazy">` : ''}
          <span class="dq-tile-txt"><b>${t.label}</b><small>${t.n ? `${t.n} meal${t.n === 1 ? '' : 's'}` : 'none tonight'}</small></span>
        </button>`).join('')}
      <button class="dq-tile dq-any" data-dq="__any">
        <span class="dq-collage">${collage.map(src => `<img src="${src}" alt="" loading="lazy">`).join('')}</span>
        <span class="dq-tile-txt"><b>Anything works</b><small>all ${left.length}</small></span>
      </button>
    </div>
    <div class="dq-foot">
      ${DINNER.trail.length ? '<button class="dq-link" id="dqBack">← Back</button>' : ''}
      <button class="dq-link" id="dqShow">Just show me the ${left.length}</button>
      ${DINNER.trail.length ? '<button class="dq-link" id="dqReset">Start over</button>' : ''}
    </div>
  </div>`;
}

/* ------------------------------------------------------------ recipe import
   A recipe line -> { amount, term }. Deterministic on purpose (no AI, no key): the
   matcher already copes with over-specific terms by dropping words from the FRONT
   until something matches, so the cleaner only has to strip what is certainly not
   part of the product - quantity, unit, prep notes after a comma, parentheses,
   "or" alternatives - and must NOT over-simplify ("diced tomatoes" is a product;
   "tomatoes" is a different one). */
const ING_UNITS = 'cups?|c|tablespoons?|tbsps?|tbs|teaspoons?|tsps?|ounces?|oz|fl\\.?\\s?oz|pounds?|lbs?|grams?|g|kilograms?|kgs?|kg|milliliters?|ml|liters?|litres?|l|cloves?|cans?|jars?|packages?|pkgs?|packets?|sticks?|pinch(?:es)?|dash(?:es)?|bunch(?:es)?|heads?|slices?|pieces?|sprigs?|stalks?|cubes?|bottles?|bags?|boxes|box|containers?|handfuls?|quarts?|qt|pints?|pt|gallons?';
const ING_QTY = '(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?|\\.\\d+)';
const ING_AMOUNT_RE = new RegExp('^(' + ING_QTY + '(?:\\s*(?:-|–|to)\\s*' + ING_QTY + ')?)\\s*(?:\\(([^)]*)\\))?\\s*((?:' + ING_UNITS + ')\\.?(?=\\s|$))?\\s*', 'i');
const ING_VULGAR = { '½': ' 1/2', '¼': ' 1/4', '¾': ' 3/4', '⅓': ' 1/3', '⅔': ' 2/3', '⅛': ' 1/8', '⅜': ' 3/8', '⅝': ' 5/8', '⅞': ' 7/8' };
const ING_PREP = /\b(finely|roughly|thinly|coarsely|freshly|lightly|firmly|loosely|chopped|minced|cubed|peeled|seeded|deseeded|halved|quartered|trimmed|softened|melted|beaten|mashed|pitted|divided|packed|drained|rinsed|thawed|optional|to taste|for serving|for garnish|for topping|as needed|room temperature|plus more[^,]*|about|approximately)\b/g;
const ING_COLOURS = new Set(['green', 'red', 'yellow', 'orange', 'white', 'black', 'fresh', 'dried', 'frozen', 'canned', 'large', 'small', 'medium', 'sweet', 'hot', 'mild', 'sharp']);
/* Words that find the WRONG product when used bare - each one was a real failure in
   this project (check_meals.py history): butter -> butter LETTUCE, honey -> Honeycrisp
   APPLES, baking powder -> baking COCOA, bacon -> a chicken Caesar salad kit, tortilla ->
   tortilla CHIPS, garlic -> garlic bread/powder. */
const ING_SYNONYMS = [
  [/^(?:garlic|garlic cloves?|cloves? (?:of )?garlic|minced garlic|fresh garlic)$/, 'fresh garlic'],
  [/^(?:onions?|yellow onions?|sweet onions?|white onions?)$/, 'yellow onion'],
  [/^butter$/, 'unsalted butter'], [/^bacon$/, 'sliced bacon'], [/^honey$/, 'raw honey'],
  [/^baking powder$/, 'double acting baking powder'],
  [/^(?:flour )?tortillas?$/, 'flour tortillas'],
  [/^(?:potatoes?|russet potato(?:es)?)$/, 'russet potatoes'],
  [/^chicken$/, 'chicken breast'],
  [/^(limes?|lemons?|avocados?)$/, (m) => m[1].replace(/s$/, '')],
  [/^(?:beef )?stew(?:ing)? (?:meat|beef)$/, 'chuck roast'],
  // found by running 90 bare recipe words through the catalog (2026-09-30): each of these
  // matched the WRONG kind of product on a strict match
  [/^milk$/, 'whole milk'],                                              // -> buttermilk
  [/^(?:heavy |whipping |heavy whipping )?cream$/, 'heavy whipping cream'], // -> sour cream
  [/^(?:granulated |white |cane )?sugar$/, 'granulated sugar'],          // -> "no added sugar" orange juice
  [/^(light |dark )?brown sugar$/, (m) => (m[1] || 'light ') + 'brown sugar'], // -> instant oatmeal, K-cups
  [/^(?:long[- ]grain )?white rice$/, 'long grain white rice'],          // -> white QUINOA
  [/^rice$/, 'brown rice'],                                              // -> quinoa
  [/^(?:sandwich |white |wheat )?bread$/, 'whole wheat bread'],          // -> crispbread crackers
  [/^(?:whole kernel |frozen |fresh )?corn$/, 'sweet corn'],             // -> peppercorns
  [/^(?:yellow |prepared )?mustard$/, 'yellow mustard'],                 // -> mustard powder
  [/^(?:(?:large|medium|extra[- ]large|whole|fresh) )*eggs?$/, 'eggs'],         // "egg" -> a fruit-and-veggie wash
  [/^(?:panko|plain|italian|seasoned)?\s?bread ?crumbs?$|^panko(?: bread ?crumbs)?$/, 'bread crumbs'],
  [/^scallions?$/, 'green onions'],
  [/^(?:crushed )?red pepper flakes?$/, 'crushed red pepper'],
  [/^(?:red |green |yellow |orange )?bell peppers?$/, 'bell peppers'],   // -> jarred ROASTED peppers
  [/^cilantro$/, 'fresh cilantro'],                                      // -> freeze-dried
  [/^(?:grated|shredded) cheddar(?: cheese)?$/, 'shredded cheddar'],
  [/^(?:fresh )?ginger ?root$/, 'fresh ginger'],
  [/^(?:all[- ]purpose )?flour$/, 'all purpose flour'],
];
const ING_STAPLES = [
  /^(?:(?:kosher|sea|table|coarse|fine|flaky)\s+)?salt(?:\s+and\s+(?:(?:freshly|ground|cracked)\s+)*(?:black\s+)?pepper)?$/,
  /^(?:(?:freshly|ground|cracked)\s+)*(?:black\s+|white\s+)?pepper$/,
  /^(?:(?:cold|warm|hot|boiling|ice|lukewarm)\s+)?water$/, /^ice$/,
];

function parseIngredientLine(rawLine) {
  let s = String(rawLine || '').replace(/[½¼¾⅓⅔⅛⅜⅝⅞]/g, m => ING_VULGAR[m]).replace(/ /g, ' ');
  s = s.replace(/^[\s▢☐□•·*\-–—✓✔▪►]+/, '').replace(/\s+/g, ' ').trim();
  if (!s) return { raw: rawLine, header: true };
  // "SAUCE:", "For the marinade:" - a heading, not an ingredient
  if ((/:$/.test(s) || /^for the\b/i.test(s)) && !/\d/.test(s)) return { raw: rawLine, header: true };

  // Method steps, not ingredients: someone pasting a whole recipe pastes the instructions too.
  // Starts with a cooking verb (whole word - "cooked rice" and "heavy cream" are not steps) and
  // has no quantity, or is simply a long sentence with no quantity.
  const words = s.split(/\s+/).length;
  const hasQty = new RegExp('^(?:a\\s+)?(?:' + ING_QTY + '|pinch|dash|handful)', 'i').test(s);
  const stepVerb = /^(?:step\s*\d+[:.)]?\s*|\d+[.)]\s+)?(?:preheat|mix|stir|bake|cook|heat|add|combine|whisk|serve|bring|place|pour|season|let|remove|cover|simmer|blend|fold|grease|line|transfer|drain|toss|sprinkle|top (?:with|each|the|it)|garnish|enjoy|slice|chop|cut|roast|grill|fry|saute|boil|meanwhile|once|when|in a|on a|over|while|using|directions?|instructions?|method|notes?|tip)\b(?![- ](?:fry|and|proof|off|of)\b)/i;
  if (/^(?:ingredients?|directions?|instructions?|method|notes?|steps?|for serving|to serve|toppings?|garnish(?:es)?)$/i.test(s)) return { raw: rawLine, header: true };
  if (/^(?:additional|other|extra|any other)\s+(?:seasonings?|toppings?|ingredients?|spices|add-ins?)\b/i.test(s) && !/\d/.test(s)) return { raw: rawLine, header: true };   // "additional seasonings optional!" is a note, not a product
  if ((stepVerb.test(s) && words >= 3 && !/^\d+\s+(?:\d+\/\d+\s+)?(?:cups?|tbsp|tsp|oz|lb)/i.test(s)) || (!hasQty && words > 12)) {
    return { raw: rawLine, header: true };
  }

  let amount = '';
  const loose = s.match(/^(?:a\s+)?(pinch|dash|handful|splash|drizzle)(?:\s+of)?\s+/i);
  if (loose) { amount = loose[1].toLowerCase(); s = s.slice(loose[0].length); }
  else {
    const m = s.match(ING_AMOUNT_RE);
    if (m) {
      amount = [m[1], (m[3] || '').replace(/\.$/, ''), m[2] ? '(' + m[2] + ')' : ''].filter(Boolean).join(' ').trim();
      s = s.slice(m[0].length);
    }
  }
  while (/\([^()]*\)/.test(s)) s = s.replace(/\([^()]*\)/g, ' ');   // incl. "((or any broth))"
  // accents off (jalapeño -> jalapeno) so they are not stripped to a gap later
  s = s.split(/[,;]| - | – /)[0].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  // "butter or margarine" -> butter; "green or red bell pepper" -> red bell pepper
  const alt = s.match(/^(\S+)\s+or\s+(.+)$/);
  if (alt && ING_COLOURS.has(alt[1])) s = alt[2];
  else {
    // "chicken or beef stock" -> chicken stock (share the last word); "butter or margarine" -> butter
    const shared = s.match(/^(\S+)\s+or\s+\S+(?:\s+\S+)*?\s+(\S+)$/);
    s = shared ? shared[1] + ' ' + shared[2] : s.replace(/\s+(?:or|and\/or)\s+.*$/, '');
  }
  s = s.replace(/^cut\b.*$/, '').replace(/^hot cooked\b/, 'cooked').replace(ING_PREP, ' ');
  // lean ratios ("90/10") and sizes are not searchable product words; the store writes "93% lean"
  s = s.replace(/\b\d{2}\/\d{2}\b/g, ' ').replace(/^\s*(?:extra[- ]large|large|medium|small|big)\s+/, '');
  s = s.replace(/[^a-z0-9%&' .-]/g, ' ').replace(/\s+/g, ' ').replace(/^(?:of|a|an|the)\s+/, '').replace(/\bof\b\s*$/, '').trim();
  for (const [re, to] of ING_SYNONYMS) {
    const m = s.match(re);
    if (m) { s = typeof to === 'function' ? to(m) : to; break; }
  }
  return { raw: rawLine, header: false, amount, term: s, staple: ING_STAPLES.some(re => re.test(s)) };
}

/* ------------------------------------------------------------ plan my week
   Type the kinds of meals you want for each part of the day and get ONE
   shopping list. Nothing touches the list until "Add the week" is pressed, and
   an ingredient two meals share becomes a single line that says how many meals
   need it - the list has items, not amounts, so that is the honest way to say
   "buy enough for both". */
const PLAN_KEY = 'groceryscorer_plan_v1';
const SLOTS = [
  { key: 'breakfast', label: 'Breakfasts', ph: 'overnight oats, french toast…' },
  { key: 'lunch',     label: 'Lunches',    ph: 'sandwiches, pasta…' },
  { key: 'dinner',    label: 'Dinners',    ph: 'tacos, chili…' },
];
const PLAN_STOP = new Set(['and', 'the', 'a', 'some', 'for', 'with', 'of']);
let PLAN = { breakfast: [], lunch: [], dinner: [] };

function loadPlan() {
  const empty = { breakfast: [], lunch: [], dinner: [] };
  try {
    const s = JSON.parse(localStorage.getItem(PLAN_KEY) || '{}');
    for (const k of Object.keys(empty)) if (Array.isArray(s[k])) empty[k] = s[k].filter(x => typeof x === 'string');
  } catch (e) {}
  return empty;
}
function savePlan() { try { localStorage.setItem(PLAN_KEY, JSON.stringify(PLAN)); } catch (e) {} }

const planNorm = t => (t || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
// "sandwiches" -> "sandwich", "tacos" -> "taco", "pancakes" -> "pancake", "berries" -> "berry"
const planSingular = w => w.endsWith('ies') ? w.slice(0, -3) + 'y'
  : /(ch|sh|ss|x)es$/.test(w) ? w.slice(0, -2)
  : (w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w;
const planWords = t => planNorm(t).split(' ').filter(w => w && !PLAN_STOP.has(w));
const planSing = t => planWords(t).map(planSingular).join(' ');

function slotMeals(slot) {
  return MEALS.filter(m => m.course === slot || (m.also || []).includes(slot));
}
function mealAvg(m) {
  const sc = mealPicks(m).filter(Boolean).map(p => GS.scoreFor(p.sku)).filter(v => v != null);
  return sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length) : null;
}

/* Matches for one typed phrase, best first. Relevance: 0 = the phrase IS a
   title or tag ("tacos"), 1 = every word is in the title/tags, 2 = only the
   subtitle mentions it. Ties go to the healthiest meal. An empty phrase returns
   the slot's healthiest meals as ideas. */
function planMatches(slot, phrase) {
  const pool = slotMeals(slot);
  const words = planWords(phrase);
  const score = m => mealAvg(m) ?? -1;
  if (!words.length) return pool.map(m => ({ m, r: 1 })).sort((a, b) => score(b.m) - score(a.m));
  const want = planSing(phrase);
  const hit = (hay, w) => hay.includes(w) || hay.includes(planSingular(w));
  return pool.map(m => {
    const core = planNorm([m.title, ...(m.tags || [])].join(' '));
    const all = planNorm([m.title, ...(m.tags || []), m.subtitle || ''].join(' '));
    if (!words.every(w => hit(all, w))) return null;
    const exact = [m.title, ...(m.tags || [])].some(t => planSing(t) === want);
    const r = exact ? 0 : words.every(w => hit(core, w)) ? 1 : 2;
    return { m, r };
  }).filter(Boolean).sort((a, b) => a.r - b.r || score(b.m) - score(a.m) || a.m.title.localeCompare(b.m.title));
}

// term -> Set of meal ids that need it, across the whole plan (each meal once)
const AMOUNTS = new Map();     // ingredient -> { meal id: amount }, rebuilt by planIngredients()
function planIngredients() {
  AMOUNTS.clear();
  const ids = new Set([...PLAN.breakfast, ...PLAN.lunch, ...PLAN.dinner]);
  const out = new Map();
  for (const id of ids) {
    const m = MEALS.find(x => x.id === id);
    if (!m) continue;
    m.items.forEach((q, i) => {
      if (!out.has(q)) out.set(q, new Set());
      out.get(q).add(id);
      const a = mealAmount(m, i);
      if (a) { if (!AMOUNTS.has(q)) AMOUNTS.set(q, {}); AMOUNTS.get(q)[id] = a; }
    });
  }
  return out;
}

const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mealThumb(m) {
  return m.image ? `<img src="${m.image}" alt="" loading="lazy">`
    : `<div style="width:52px;height:52px;border-radius:10px;flex:0 0 auto;background:${m.accent || '#999'}"></div>`;
}
function scorePill(v) {
  return v == null ? '<span class="pl-sc" style="background:#CFC3AC">—</span>'
    : `<span class="pl-sc" style="background:${GS.scoreColor(v)}">${v}</span>`;
}

function refreshChosen(slot) {
  const box = document.getElementById('plChosen_' + slot); if (!box) return;
  const meals = PLAN[slot].map(id => MEALS.find(m => m.id === id)).filter(Boolean);
  box.innerHTML = meals.length ? meals.map(m => `
    <div class="pl-row">
      <button class="pl-row" style="border:none;padding:0;margin:0;background:none;flex:1" data-plan-open="${m.id}">
        ${mealThumb(m)}<span class="pl-t">${esc(m.title)}<small>${m.items.length} ingredients · <u>see products &amp; recipe</u></small></span>${scorePill(mealAvg(m))}
      </button>
      <button class="pl-x" data-plan-remove="${slot}|${m.id}" aria-label="Remove ${esc(m.title)}">✕</button>
    </div>`).join('') : '<div class="pl-empty">Nothing picked yet.</div>';
  const c = document.getElementById('plCount_' + slot); if (c) c.textContent = meals.length ? `· ${meals.length}` : '';
}

function refreshSugg(slot, typed) {
  const box = document.getElementById('plSugg_' + slot); if (!box) return;
  const last = (typed || '').split(/[,;\n+]/).pop();
  const chosen = new Set(PLAN[slot]);
  const found = planMatches(slot, last).filter(x => !chosen.has(x.m.id));
  const words = planWords(last);
  box.innerHTML = (words.length ? `<div class="pl-sugg-h">${found.length ? 'Matches — tap one to see it, + to add' : 'Nothing else matches'}</div>`
                                : '<div class="pl-sugg-h">Ideas — tap one to see it, + to add</div>')
    + found.slice(0, 6).map(({ m }) => `
      <div class="pl-sug">
        <button class="pl-sug-open" data-plan-open="${m.id}" aria-label="See ${esc(m.title)}">
          ${mealThumb(m)}<span class="pl-t">${esc(m.title)}<small>${esc(m.subtitle || '')}</small></span>${scorePill(mealAvg(m))}
        </button>
        <button class="pl-plus" data-plan-add="${slot}|${m.id}" aria-label="Add ${esc(m.title)}">+</button>
      </div>`).join('');
}

function refreshSummary() {
  const box = document.getElementById('plSummary'); if (!box) return;
  const ids = new Set([...PLAN.breakfast, ...PLAN.lunch, ...PLAN.dinner]);
  const meals = [...ids].filter(id => MEALS.some(m => m.id === id));
  if (!meals.length) {
    box.innerHTML = `<div class="pl-stats">Pick a few meals below and I'll build <b>one</b> shopping list for the week.</div>
      <button class="pl-add" disabled>Add the week to my shopping list</button>`;
    return;
  }
  const ing = planIngredients();
  const scores = [...ing.keys()].map(q => (GS.bestFor(q, FILTERS, 1)[0])).filter(Boolean)
    .map(p => GS.scoreFor(p.sku)).filter(v => v != null);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  const shared = [...ing.values()].filter(s => s.size > 1).length;
  const onList = [...ing.keys()].filter(q => MY_LIST.some(e => e.q === q)).length;
  box.innerHTML = `<div class="pl-stats"><b>${meals.length}</b> meal${meals.length === 1 ? '' : 's'} ·
      <b>${ing.size}</b> ingredients${shared ? ` (${shared} shared)` : ''}${avg != null ? ` · <b style="color:${GS.scoreColor(avg)}">${avg}</b> avg score` : ''}
      ${onList ? `<br>${onList} already on your list` : ''}</div>
    <button class="pl-add" id="plAddWeek">Add the week to my shopping list</button>`;
}

function renderPlan() {
  const box = document.getElementById('planTab');
  if (!MEALS.length) { box.innerHTML = '<div class="empty-state">No meals loaded.</div>'; return; }
  PLAN = loadPlan();
  box.innerHTML = `<div class="pl">
    <div class="pl-head"><h2>Plan your week</h2>
      <p>Type the kinds of meals you want — “tacos”, “sandwiches”, “overnight oats” — for each part of the day,
      press Enter, and pick from what matches. Then add the whole week to your shopping list at once.</p></div>
    <div class="pl-summary" id="plSummary"></div>
    ${SLOTS.map(s => `<section class="pl-slot">
      <h3>${s.label}<span id="plCount_${s.key}"></span></h3>
      <div id="plChosen_${s.key}"></div>
      <input class="pl-input" data-slot="${s.key}" placeholder="${s.ph}" autocomplete="off" enterkeyhint="done">
      <div class="pl-msg" id="plMsg_${s.key}"></div>
      <div id="plSugg_${s.key}"></div>
    </section>`).join('')}
    <div class="pl-foot"><button class="dq-link" id="plClear">Clear the plan</button></div>
  </div>`;
  SLOTS.forEach(s => { refreshChosen(s.key); refreshSugg(s.key, ''); });
  refreshSummary();
}

function planChanged(slot) {
  savePlan();
  refreshChosen(slot);
  const inp = document.querySelector(`.pl-input[data-slot="${slot}"]`);
  refreshSugg(slot, inp ? inp.value : '');
  refreshSummary();
}

// Enter: add the best match for each comma-separated phrase; keep what matched nothing.
function planCommit(slot) {
  const inp = document.querySelector(`.pl-input[data-slot="${slot}"]`);
  const msg = document.getElementById('plMsg_' + slot);
  const phrases = inp.value.split(/[,;\n+]/).map(s => s.trim()).filter(Boolean);
  const unmatched = [], dupes = [];
  for (const ph of phrases) {
    const found = planMatches(slot, ph);
    if (!found.length) { unmatched.push(ph); continue; }
    const next = found.find(x => !PLAN[slot].includes(x.m.id));
    if (!next) { dupes.push(ph); continue; }
    PLAN[slot].push(next.m.id);
  }
  inp.value = unmatched.join(', ');
  msg.textContent = unmatched.length ? `No meal matches “${unmatched.join('”, “')}” — try another word.`
    : dupes.length ? `Already in your plan: ${dupes.join(', ')}.` : '';
  planChanged(slot);
}

function addWeekToList() {
  const ing = planIngredients();
  let added = 0, merged = 0;
  for (const [q, ids] of ing) {
    const uses = ids.size;
    const ex = MY_LIST.find(e => e.q === q);
    const amts = AMOUNTS.get(q) || {};
    const target = ex || { q, sku: (GS.bestFor(q, FILTERS, 1)[0] || {}).sku || null, checked: false };
    for (const [mid, a] of Object.entries(amts)) if (!(target.amts && mid in target.amts)) addAmount(target, mid, a);
    if (uses > (target.uses || 1)) target.uses = uses;
    if (ex) { merged++; continue; }
    MY_LIST.push(target);
    added++;
  }
  GS.saveMyList(MY_LIST);
  renderListBar();
  toast(added || merged ? `${added} added${merged ? `, ${merged} already on your list` : ''}` : 'Nothing to add');
  openList();
  refreshSummary();
}

function planClick(e) {
  const add = e.target.closest('[data-plan-add]');
  if (add) { const [slot, id] = add.dataset.planAdd.split('|'); if (!PLAN[slot].includes(id)) PLAN[slot].push(id); planChanged(slot); return; }
  const rm = e.target.closest('[data-plan-remove]');
  if (rm) { const [slot, id] = rm.dataset.planRemove.split('|'); PLAN[slot] = PLAN[slot].filter(x => x !== id); planChanged(slot); return; }
  const open = e.target.closest('[data-plan-open]');
  if (open) { renderMeal(open.dataset.planOpen); return; }
  if (e.target.closest('#plAddWeek')) { addWeekToList(); return; }
  if (e.target.closest('#plClear')) {
    PLAN = { breakfast: [], lunch: [], dinner: [] }; savePlan(); renderPlan();
  }
}

   Link or pasted text -> a REVIEW list, never straight to the shopping list. Every line
   shows what was understood (amount + search word, editable), which ShopRite product it
   matched, and whether the match is shaky - because matching loose words to products has
   gone wrong here before (butter -> butter lettuce) and only a person looking at the
   product can catch a match that is strict but wrong. */
let IMPORT = { title: '', source: '', via: '', rows: [], skipStaples: true, open: null };
let IMPORT_AI = null;       // null = not asked yet, then true/false: is an API key set up?
let IMPORT_SERVER = true;   // false on the hosted copy: no serve.py behind it, so no /api/* routes yet
const VIDEO_HOSTS = /(?:tiktok|instagram|youtube|youtu\.be|facebook|fb\.watch|vimeo|snapchat)/i;
const looksLikeUrl = t => /^(?:https?:\/\/|www\.)\S+$/i.test(String(t).trim());

async function importStatus() {
  try { const st = await (await fetch('/api/status')).json(); IMPORT_AI = !!st.ai_key; SHARE_LAN = st.lan || null; }
  catch (e) { IMPORT_AI = false; IMPORT_SERVER = false; }
  renderShareSetup();
}
function refreshImportAi() {
  const b = document.getElementById('imAi'), n = document.getElementById('imAiNote');
  if (!b) return;
  b.hidden = !IMPORT_AI;
  n.textContent = !IMPORT_SERVER ? HOSTED_IMPORT_NOTE
    : IMPORT_AI ? 'The AI helper is on - use it if the ingredients below look wrong or missing.'
    : 'The AI helper is off (no key set up yet). Links and pasted ingredient lists work without it.';
}
function importMsg(text, err) {

/* ------------------------------------------------- share from your own browser
   Some recipe sites refuse to hand their pages to a program, so a pasted link can come back
   empty. These two tools read the recipe in the person's OWN browser instead - on a page
   they are already looking at - and open the app with what they found:
     - iPhone: a Shortcut in Safari's Share sheet ("Run JavaScript on Web Page", then open
       the URL it returns)
     - laptop: a bookmarklet, the same code behind a bookmark
   shareGrab() is that code. It is turned into a string with toString(), so it must not use
   anything from outside itself. It prefers the page's structured recipe data, then the
   recipe card's ingredient list, and only then sends the page's text for the AI helper.
   Everything it sends arrives in the URL's #fragment, which is never sent to a server. */
function shareGrab(base) {
  function clean(s) { return String(s || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }
  var out = { u: location.href, t: '', i: [], x: '' };
  function walk(n, f) {
    if (!n || typeof n !== 'object') return;
    if (Array.isArray(n)) { for (var a = 0; a < n.length; a++) walk(n[a], f); return; }
    f(n);
    for (var k in n) if (n[k] && typeof n[k] === 'object') walk(n[k], f);
  }
  var ss = document.querySelectorAll('script[type="application/ld+json"]');
  for (var j = 0; j < ss.length && !out.i.length; j++) {
    try {
      walk(JSON.parse(ss[j].textContent), function (d) {
        var t = [].concat(d['@type']);
        if (!out.i.length && t.indexOf('Recipe') >= 0 && d.recipeIngredient) {
          out.i = [].concat(d.recipeIngredient).map(clean).filter(Boolean).slice(0, 60);
          out.t = clean(d.name);
        }
      });
    } catch (e) {}
  }
  if (!out.i.length) {
    var li = document.querySelectorAll('[itemprop="recipeIngredient"],[itemprop="ingredients"],li[class*="ingredient"],[class*="ingredients"] li');
    var seen = {};
    for (var m = 0; m < li.length && out.i.length < 60; m++) {
      var s = clean(li[m].innerText || li[m].textContent);
      if (s && s.length < 200 && !seen[s]) { seen[s] = 1; out.i.push(s); }
    }
  }
  if (!out.t) out.t = clean(document.title).slice(0, 120);
  if (!out.i.length) out.x = String(document.body.innerText || '').slice(0, 20000);
  return base + '/home.html#share=' + encodeURIComponent(JSON.stringify(out));
}
const shareCode = base => '(' + shareGrab.toString() + ')(' + JSON.stringify(base) + ')';
const shortcutCode = base => 'completion(' + shareCode(base) + ');';
const bookmarkletCode = base => 'javascript:' + encodeURIComponent('window.open(' + shareCode(base) + ',"_blank");void 0');
let SHARE_LAN = null;

function renderShareSetup() {
  const el = document.getElementById('imShare'); if (!el) return;
  const phoneBase = SHARE_LAN ? `http://${SHARE_LAN}:${location.port || 80}` : location.origin;

      <li>Tap the <b>ⓘ</b> (or the name) → turn on <b>Show in Share Sheet</b>, and set the input to <b>Safari web pages</b> only.</li>
      <li>Add the action <b>Run JavaScript on Web Page</b>. Delete the sample code and paste the code below.</li>

    <h4>Laptop (Safari or Chrome)</h4>
    <p>Drag this button to your bookmarks bar, then click the bookmark on any recipe page:

    <p class="im-ai">Safari: show the bar with View → Show Favorites Bar. If dragging doesn't work, add any bookmark, edit it, and paste the copied link as its address.</p>

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (err) { toast("Couldn't copy - select and copy by hand"); }
    ta.remove();
  }
}

// The app was opened by the Shortcut or bookmarklet: #share=<json>. Untrusted input - a
// link anyone could craft - so it is size-capped, only used as text, and escaped on display.
async function handleShare() {
  const ml = /^#meal=([a-z]+)$/.exec(location.hash);
  if (ml) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (MEALS.some(x => x.id === ml[1])) addMeal(ml[1]);
    return;
  }
  const mk = /^#make=([a-z]+)$/.exec(location.hash);
  if (mk) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (MAKEABLE.some(x => x.id === mk[1])) addMakeIngredients(mk[1]);
    return;
  }
  const m = /^#share=(.+)$/.exec(location.hash);
  if (!m) return;
  let d;
  try { d = JSON.parse(decodeURIComponent(m[1])); } catch (e) { d = null; }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  setTab('import');
  if (!d || typeof d !== 'object') { importMsg("That share didn't come through - try again.", true); return; }
  const str = (v, n) => String(v == null ? '' : v).slice(0, n);
  const lines = Array.isArray(d.i) ? d.i.slice(0, 60).map(v => str(v, 200)).filter(Boolean) : [];
  let host = ''; try { host = new URL(str(d.u, 2000)).hostname.replace(/^www\./, ''); } catch (e) {}
  if (lines.length) { importShowLines(lines, str(d.t, 120), host, 'your browser'); return; }
  const text = str(d.x, 20000);
  if (!text.trim()) { importMsg("Couldn't find a recipe on that page.", true); return; }
  if (IMPORT_AI === null) await importStatus();
  refreshImportAi();
  document.getElementById('imBox').value = text;
  if (IMPORT_AI) importAi();
  else importMsg("That page had no recipe card I could read. Paste just the ingredient list, or set up the AI helper.", true);
}

function importRematch(r) {

  r.relaxed = r.alts.length ? GS.relaxedWord() : null;    // the words dropped to find anything
  if (r.pick && !r.alts.some(a => a.sku === r.pick)) r.pick = null;

// rows: [{raw, amount, term, staple}] -> matched, pre-ticked, rendered
function importFinishRows(rows, title, source, via) {
  IMPORT.title = title || ''; IMPORT.source = source || ''; IMPORT.via = via || ''; IMPORT.open = null;
  IMPORT.rows = rows.map((r, i) => ({ ...r, id: i, pick: null }));

  IMPORT.rows.forEach(r => { r.include = !!r.alts.length && !(IMPORT.skipStaples && r.staple); });
  if (!IMPORT.rows.length) {
    importMsg("I couldn't find any ingredients in that. Try pasting just the ingredient lines." + (IMPORT_AI ? ' Or use the AI helper.' : ''), true);

const HOSTED_IMPORT_NOTE = "On this version, paste the ingredient list (copy it from the recipe page). Reading a recipe straight from a link, and the AI helper, are coming here soon.";
async function importGo() {
  const v = document.getElementById('imBox').value.trim();
  if (!v) { importMsg('Paste a link or the ingredients first.', true); return; }
  if (looksLikeUrl(v) && VIDEO_HOSTS.test(v)) {
    importMsg("Video links can't be read yet — the recipe is spoken or shown on screen. Copy the recipe from the video's caption or description and paste that here.", true);
    return;
  }
  if (looksLikeUrl(v) && !IMPORT_SERVER) { importMsg(HOSTED_IMPORT_NOTE, true); return; }
  if (looksLikeUrl(v)) {
    importMsg('Reading the page…');
    try {
      const r = await (await fetch('/api/recipe?url=' + encodeURIComponent(/^www\./i.test(v) ? 'https://' + v : v))).json();
      if (!r.ok) { importMsg(r.error, true); return; }
      importShowLines(r.ingredients, r.title, r.source, r.via);
    } catch (e) { importMsg("Couldn't reach the app's server. Is it running?", true); }
    return;
  }
  // A whole page is far too long to be an ingredient list. The line-by-line cleaner would turn
  // menus and comments into "ingredients", so hand it to the AI helper, which finds the recipe.
  if (v.length > 2500) {
    if (IMPORT_AI) { importAi(); return; }
    importMsg("That looks like a whole web page. Reading a page needs the AI helper (no key is set up), so paste just the ingredient list instead.", true);
    return;
  }
  let lines = v.split(/\r?\n/);
  if (lines.length === 1 && (v.match(/,/g) || []).length >= 2 && !/\d/.test(v)) lines = v.split(',');
  importShowLines(lines, '', '', 'pasted text');
}

async function importAi() {
  const v = document.getElementById('imBox').value.trim();
  if (!v) { importMsg('Paste the recipe text first.', true); return; }
  if (looksLikeUrl(v)) { importMsg('The AI helper reads text. Paste the recipe text here instead of a link.', true); return; }
  importMsg('Asking the AI helper…');
  try {
    const r = await (await fetch('/api/recipe_ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: v }) })).json();
    if (!r.ok) { importMsg(r.error, true); return; }
    importFinishRows(r.ingredients.map(it => {
      const c = parseIngredientLine(it.term);
      return { raw: '', amount: it.amount, term: c.term || it.term, staple: c.staple };
    }), r.title, '', 'AI helper');
  } catch (e) { importMsg("Couldn't reach the app's server. Is it running?", true); }
}

/* A strict match can still be the wrong KIND of product ("canola oil" -> a butter spread
   that lists canola oil; "vegetable oil" -> tuna packed in it). When the word names a
   basic, check that the product is filed where that basic lives, and say so if not. */
const ING_SANITY = [
  [/\boil$/, /oils|vinegar/i, 'an oil'], [/\b(?:broth|stock)$/, /broth|stock|soup/i, 'a broth'],
  [/\bsugar$/, /sugar|sweeten|baking/i, 'a sugar'], [/\bflour$/, /flour|baking/i, 'a flour'],
  [/\bmilk$/, /milk|dairy/i, 'a milk'], [/\bbutter$/, /butter/i, 'butter'],
  [/\b(?:cheddar|mozzarella|parmesan|cheese)$/, /cheese/i, 'a cheese'],
  [/^(?:fresh )?(?:parsley|basil|mint|dill|thyme|rosemary|sage|oregano|chives|cilantro)$/, /herb|spice|season/i, 'a herb'],
];
function importOddlyFiled(term, p) {
  const crumb = p.category_breadcrumb || '';
  for (const [re, ok, what] of ING_SANITY)
    if (re.test(term) && !ok.test(crumb)) return { what, crumb: crumb.replace(/^Grocery\//, '').split('/').slice(0, 2).join(' › ') };
  return null;
}

function importRow(r, i) {
  const sku = r.pick || (r.alts[0] || {}).sku;
  const p = sku ? GS.product(sku) : null, sc = sku ? GS.scoreFor(sku) : null;
  const match = p ? `<div class="im-match">${p.image_url ? `<img src="${p.image_url}" alt="">` : '<div class="im-noimg"></div>'}
      <div class="im-mname">${esc(p.name)}<small>${GS.priceFor(sku) || ''}</small></div>
      ${scorePill(sc == null ? null : Math.round(sc))}
      <button class="im-swap" data-im-swap="${i}">${IMPORT.open === i ? 'Close' : 'Swap'}</button></div>` : '';
  let odd;
  const wantsFresh = /\b(bunch|sprigs?|fresh|leaves)\b/i.test((r.amount || '') + ' ' + r.raw + ' ' + r.term);
  const herb = /^(?:fresh )?(?:parsley|basil|mint|dill|thyme|rosemary|sage|oregano|chives)$/.test(r.term);
  const dried = p && wantsFresh && herb && !/\b(fresh|bunch)\b/i.test(p.name);
  const tag = !p ? '<span class="im-tag none">Nothing found — try a simpler word above</span>'
    : dried ? '<span class="im-tag warn">You asked for fresh — this is the dried jar. Fresh herbs are in the produce section.</span>'
    : (odd = importOddlyFiled(r.term, p)) ? `<span class="im-tag warn">This is filed under ${esc(odd.crumb)} — not ${odd.what}. Check it, or try another word.</span>`
    : r.relaxed ? `<span class="im-tag warn">No exact match — searched without “${esc(r.relaxed)}”. Check this one.</span>` : '';
  const alts = IMPORT.open === i ? `<div class="im-alts">${r.alts.map(a => {
      const s = GS.scoreFor(a.sku);
      return `<button class="im-alt ${a.sku === sku ? 'cur' : ''}" data-im-pick="${i}|${a.sku}">${scorePill(s == null ? null : Math.round(s))}
        <span style="flex:1">${esc(a.name)}</span><span>${GS.priceFor(a.sku) || ''}</span></button>`;
    }).join('')}</div>` : '';
  return `<div class="im-row ${r.include ? '' : 'off'}">
    <label class="im-inc"><input type="checkbox" data-im-inc="${i}" ${r.include ? 'checked' : ''} aria-label="Include ${esc(r.term)}"></label>
    <div class="im-body"><input class="im-term" data-im-term="${i}" value="${esc(r.term)}" aria-label="Ingredient search word">
      ${r.amount || r.raw ? `<div class="im-raw">${r.amount ? `<span class="im-amt">${esc(r.amount)}</span>` : ''}${esc(r.raw)}</div>` : ''}
      ${match}${tag}${alts}</div></div>`;
}

function renderImportResult() {
  const box = document.getElementById('imResult'), rows = IMPORT.rows;
  const on = rows.filter(r => r.include);
  const scores = on.map(r => { const s = r.pick || (r.alts[0] || {}).sku; return s ? GS.scoreFor(s) : null; }).filter(v => v != null);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  box.innerHTML = `${IMPORT.title ? `<div class="im-title">${esc(IMPORT.title)}</div>` : ''}
    <div class="im-sub">${IMPORT.source ? esc(IMPORT.source) + ' · ' : ''}read from ${esc(IMPORT.via)} · ${rows.length} ingredients found</div>
    <div class="pl-summary"><div class="pl-stats"><b>${on.length}</b> of ${rows.length} ticked${avg != null ? ` · <b style="color:${GS.scoreColor(avg)}">${avg}</b> avg score` : ''}</div>
      <button class="pl-add" id="imAdd" ${on.length ? '' : 'disabled'}>Add ${on.length} to my shopping list</button></div>
    <label class="im-toggle"><input type="checkbox" id="imSkip" ${IMPORT.skipStaples ? 'checked' : ''}> Skip salt, pepper and water</label>
    ${rows.map(importRow).join('')}`;
}

function importAdd() {
  let added = 0, merged = 0;
  for (const r of IMPORT.rows) {
    if (!r.include || !r.term) continue;
    const sku = r.pick || (r.alts[0] || {}).sku || null, note = r.amount || '';
    const ex = MY_LIST.find(e => e.q === r.term);
    if (ex) {                        // already on the list: keep one line, remember both amounts
      if (note && !(ex.note || '').includes(note)) ex.note = [ex.note, note].filter(Boolean).join(' + ').slice(0, 60);
      merged++; continue;
    }
    const swapped = r.pick && r.alts[0] && r.pick !== r.alts[0].sku;
    MY_LIST.push({ q: r.term, sku, checked: false, ...(swapped ? { pinned: true } : {}), ...(note ? { note: note.slice(0, 60) } : {}) });
    added++;
  }
  GS.saveMyList(MY_LIST);
  renderListBar();
  toast(added || merged ? `${added} added${merged ? `, ${merged} already on your list` : ''}` : 'Nothing ticked');
  openList();
}

function importClick(e) {
  if (e.target.closest('#imGo')) return importGo();
